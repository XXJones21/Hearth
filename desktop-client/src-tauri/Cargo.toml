[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# Settings > On disk hands a path to the OS file browser. Any plugin needs
# BOTH this dep and an entry in capabilities/default.json.
tauri-plugin-opener = "2"
# The hardware scan, the model dictionary and the download. Same crate the CLI
# and the installation skill use, so all three give identical answers.
hearth-probe = { path = "../../crates/hearth-probe" }

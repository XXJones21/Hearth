[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
# A second launch focuses the running window instead of spawning a second
# house. Three simultaneous instances fighting over one port block is how a
# delete-the-folder uninstall test turned into a mystery.
tauri-plugin-single-instance = "2"
# Settings > On disk hands a path to the OS file browser. Any plugin needs
# BOTH this dep and an entry in capabilities/default.json.
tauri-plugin-opener = "2"
# The destination picker on the found screen. Same rule: dep here, entry in
# capabilities/default.json, package in package.json.
tauri-plugin-dialog = "2"
# The hardware scan, the model dictionary and the download. Same crate the CLI
# and the installation skill use, so all three give identical answers.
hearth-probe = { path = "../../crates/hearth-probe" }

# Provisioning: unpack the bundled backend (tar.gz) and the downloaded
# runtime artifacts (zip for llama.cpp, tar.gz for the python tree).
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
# The machine's locale, captured at install time into hearth.env as the
# geocoding region bias. The installer decides; the file records.
sys-locale = "0.3"

# The house's Job Object: kill-on-close reaping for the supervised backend
# tree, the closest Windows gets to systemd's cgroup guarantee.
[target.'cfg(windows)'.dependencies]
win32job = "2"

# The unix counterpart: process groups, killed whole.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

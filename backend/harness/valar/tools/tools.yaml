# Valar tool registry -- the YAML-as-plugin-registry for daily-driver tools.
#
# Mirrors Server/skills/execute/execute.md's task_handlers idiom: each tool is a
# name + a "module:function" handler reference + an OpenAI function-calling schema.
# Adding a tool = one entry here + one handler function (see valar/tools/spec.py).
#
# ADDITIVE / OPT-IN: this registry is built only when VALAR_TOOLS_ENABLED is set
# (default OFF). It is NOT wired into voice_loop.run_turn; the tool-calling
# round-trip is the separate, opt-in valar.tools.loop.ToolCallingLoop. The working
# voice turn is unchanged until that wiring is added deliberately behind the flag.
#
# Disable any single tool without removing it via `enabled: false`.
#
# Optional `speak:` per tool -- a short thinking-filler phrase the voice loop says
# the moment the brain decides to call the tool, overlapping the handler's
# execution (the ~2s tool-turn gap). One phrase per turn (the first non-empty
# among the called tools). Omit it for fast local tools (timers, remember).
#
# Catalog metadata (2026-06-05; see wiki/architecture/harness/tool-catalog.md):
#   domain:              the tag persona `tool_grants.domains` select on
#   risk:                read | write | control (blast radius; policy hooks)
#   requires_capability: client capability key from client_info needed to offer
#                        the tool on a session (ui_render, device_actions,
#                        spatial); omit for any-client tools.
# Per-session offered set = enabled tools ∩ persona grants ∩ client capabilities.

tools:
  - name: get_weather
    description: >-
      Get the weather for a place -- current conditions + the day's high/low for
      today, or the forecast for tomorrow. Use for ANY weather question -- "what's
      the weather", "what's it like out today", "what about tomorrow", "how hot is
      it", "do I need a jacket", a named city, or the operator's own location from
      context. Always prefer this over answering about weather from general knowledge.
    handler: valar.tools.handlers.weather:current_weather
    domain: weather
    risk: read
    speak: Let me check the weather.
    parameters:
      type: object
      properties:
        location:
          type: string
          description: >-
            City or place name ONLY, e.g. "San Francisco" or "Austin, Texas".
            Never include words like "tomorrow" here -- use the day parameter.
        units:
          type: string
          enum: [imperial, metric]
          description: Temperature units. Default imperial.
        day:
          type: string
          enum: [today, tomorrow]
          description: Which day. Default today. Use tomorrow for forecast questions.
      required: [location]

  # Retired 2026-06-02: time is now AMBIENT CONTEXT (the SCX "Current context"
  # block injects the current local time every turn from the client's timezone),
  # so the brain answers the time directly without a tool call -- more reliable
  # than an 8B deciding to call this (it confabulated the time when it didn't).
  # Kept here, disabled, as a record; delete once the ambient path is proven.
  - name: current_time
    description: Get the current local time and date. Use when the user asks the time or date.
    handler: valar.tools.handlers.timers:current_time
    domain: timers
    risk: read
    enabled: false
    parameters:
      type: object
      properties: {}
      required: []

  - name: set_timer
    description: >-
      Set a countdown timer. Use for "set a timer for 5 minutes", "remind me in an
      hour". The timer state is recorded; the proactive channel announces it when due.
    handler: valar.tools.handlers.timers:set_timer
    domain: timers
    risk: write
    parameters:
      type: object
      properties:
        duration:
          type: string
          description: Natural duration, e.g. "5 minutes", "1 hour 30 minutes", "90 seconds".
        label:
          type: string
          description: Optional name for the timer, e.g. "pasta" or "laundry".
      required: [duration]

  - name: list_timers
    description: List the active timers and how much time remains on each.
    handler: valar.tools.handlers.timers:list_timers
    domain: timers
    risk: read
    parameters:
      type: object
      properties: {}
      required: []

  - name: cancel_timer
    description: Cancel an active timer by its label.
    handler: valar.tools.handlers.timers:cancel_timer
    domain: timers
    risk: write
    parameters:
      type: object
      properties:
        label:
          type: string
          description: The label of the timer to cancel.
      required: []

  - name: web_search
    description: >-
      Look up a quick fact or answer on the web (definitions, who/what is X, quick
      facts). Use when the user asks something you do not know or that may have
      changed recently.
    handler: valar.tools.handlers.web_search:web_search
    domain: search
    risk: read
    speak: One moment while I look that up.
    parameters:
      type: object
      properties:
        query:
          type: string
          description: The search query.
      required: [query]

  - name: news_headlines
    description: Get a brief summary of current news, optionally about a topic.
    handler: valar.tools.handlers.web_search:news_headlines
    domain: news
    risk: read
    speak: Let me check the headlines.
    parameters:
      type: object
      properties:
        topic:
          type: string
          description: Optional topic to focus the news on, e.g. "technology" or "sports".
      required: []

  - name: remember
    description: >-
      Store a durable fact about the user for later (in long-term memory). Use when
      the user says "remember that...", "don't forget...", or shares a lasting preference.
    handler: valar.tools.handlers.memory:remember
    domain: memory
    risk: write
    parameters:
      type: object
      properties:
        fact:
          type: string
          description: The fact to store, phrased as a standalone statement.
      required: [fact]

  - name: consult_memory
    description: >-
      Ask Selene, the memory librarian, to research a question in the
      operator's full long-term memory and notes (career history, past
      sessions, projects, life context) and report back a synthesis. Use for
      DEEP or multi-part questions about the operator's past -- "what did I
      work on at...", "summarize my time at...", "tell me about my history
      with...". For a single quick fact, use recall instead.
    handler: valar.tools.handlers.consult:consult_memory
    domain: memory
    risk: read
    speak: Let me check my library.
    parameters:
      type: object
      properties:
        question:
          type: string
          description: The full question to research in the operator's memory.
        scope:
          type: string
          enum: [background, personal_projects, sessions, all]
          description: >-
            The question's intent. background = career, employers, jobs,
            education, life history (the default) -- INCLUDING anything
            worked on AT an employer (Meta, Apple, Snap...). personal_projects
            = the operator's own side projects only. sessions = past
            conversations.
      required: [question]

  - name: recall
    description: >-
      Quick search of the operator's long-term memory: saved personal facts,
      session diaries, project notes, background knowledge. Use for a SINGLE
      specific fact or detail -- "what did I tell you about...", "do you
      remember my...". Scope the search by INTENT: background for career,
      employers, jobs, education, life history; projects for the operator's
      project work; sessions for past conversations. For deep or multi-part
      questions about the operator's past, use consult_memory instead. Prefer
      either over guessing or answering from general knowledge.
    handler: valar.tools.handlers.memory:recall
    domain: memory
    risk: read
    speak: Let me think back.
    parameters:
      type: object
      properties:
        query:
          type: string
          description: What to search memory for. Omit to list recent stored facts.
        scope:
          type: string
          enum: [all, background, personal_projects, sessions]
          description: >-
            Search intent. background = career, employers, jobs, education,
            life history -- INCLUDING anything worked on AT an employer
            (Meta, Apple, Snap...). personal_projects = the operator's own
            side projects only. sessions = past conversations. Default all.
        max_results:
          type: integer
          description: How many results to read (1-10). Default 5.
      required: []

  - name: generate_image
    description: >-
      Draw or generate an image from a description using the local art studio.
      Use for "draw me...", "generate an image of...", "make a picture...".
      The picture appears on the operator's screen by itself when it is
      finished, a minute or two later. Say it is underway; never claim it is
      already done, and never offer to fetch it.
    handler: valar.tools.handlers.imagery:generate_image
    domain: media
    risk: write
    speak: Let me set up the easel.
    parameters:
      type: object
      properties:
        prompt:
          type: string
          description: What to draw, as a rich visual description.
        orientation:
          type: string
          enum: [landscape, portrait, square]
          description: Canvas shape. Default landscape.
      required: [prompt]

  - name: check_image
    description: >-
      Say how the drawing on the easel is coming along. Use ONLY when the
      operator asks out loud ("is it ready", "how is the picture coming").
      The screen does not need this: the picture arrives there on its own.
    handler: valar.tools.handlers.imagery:check_image
    domain: media
    risk: read
    parameters:
      type: object
      properties: {}
      required: []

  - name: consult_liara
    description: >-
      Ask Liara, the CHOAM portfolio manager, for a portfolio or trading-day
      update. Use when the operator asks about CHOAM, the portfolio, positions,
      how trading is going, or for "a daily update from Liara". She reads the
      live wallet and reports back; you never touch the wallet yourself. May be
      called AGAIN in the same turn with a narrower question when her first
      answer did not cover the ask ("what can you tell me about the TSM call
      this week?") -- let HER say what the desk cannot provide.
    handler: valar.tools.handlers.consult:consult_liara
    domain: briefs
    risk: read
    speak: Let me ring the trading desk.
    parameters:
      type: object
      properties:
        question:
          type: string
          description: >-
            The operator's question for Liara, e.g. "how is the portfolio
            doing today". Omit for a general daily status update.
      required: []

  - name: consult_claude
    description: >-
      Hand a coding, research, or writing task to Claude Code, the frontier
      agent. Use for work that needs real file-level execution or judgment
      beyond a single answer: "have Claude build X", "get Claude to look at
      Y", "ask Claude to draft Z". Prefer mentat_run for beats against an
      existing plan; this is for one-off work with no plan. Claude works in a
      named workspace only. This STARTS the work and returns immediately --
      it takes about a minute, so tell the operator it is underway and use
      claude_status to report what it found.
    handler: valar.tools.handlers.claude_code:consult_claude
    domain: dev
    risk: write
    speak: Let me put Claude on that.
    parameters:
      type: object
      properties:
        task:
          type: string
          description: >-
            The task to hand over, written as an instruction to a capable
            engineer. Include everything it needs; it does not see this
            conversation.
        workspace:
          type: string
          enum: [scratch, valinor]
          description: >-
            Where it may work. "scratch" is a sandbox directory (default and
            correct for anything experimental). "valinor" is the live repo;
            only for work the operator explicitly asked to land there.
        mode:
          type: string
          enum: [acceptEdits, plan, dontAsk]
          description: >-
            "acceptEdits" lets it write files (default). "plan" makes it
            propose without changing anything.
      required: [task]

  - name: claude_status
    description: >-
      Check what Claude Code is doing, or read what it reported when it last
      finished. Use after consult_claude, and whenever the operator asks how
      it is going, what Claude found, or whether it is done.
    handler: valar.tools.handlers.claude_code:claude_status
    domain: dev
    risk: read
    parameters:
      type: object
      properties: {}
      required: []

  - name: project_status
    description: >-
      Look up the operator's notes on one of their projects. Use for "what's the
      status of <project>", "tell me about my <project> project", "where did I
      leave off on <project>", or "what projects am I working on" (omit the name
      to list them). This reads the per-project notes, which recall cannot see.
    handler: valar.tools.handlers.projects:project_status
    domain: projects
    risk: read
    speak: Let me pull up my notes.
    parameters:
      type: object
      properties:
        project:
          type: string
          description: >-
            The project name as the user said it, e.g. "valinor" or "dreamland".
            Omit to list all known projects.
      required: []

  # --- CHOAM wallet (Liara) -- read-only pull surface ---------------------------
  # Proxies CHOAM's GET /wallet/query (the money logic stays in CHOAM; these route).
  # Granted to Liara via Persona/Liara/Liara.json tool_grants.domains: ["wallet"].
  # Prerequisite: the CHOAM backend up on :8091 (CHOAM_WALLET_URL to override).
  - name: view_ledger
    description: >-
      View your AUTHORITATIVE current portfolio: every holding with its exact
      percent-of-NAV weight, cash, deployed %, NAV, and drawdown headroom to the
      ruin halt. Call this before deciding whether to hold or change anything --
      these are the real numbers; never estimate your own book.
    handler: valar.tools.handlers.choam_wallet:view_ledger
    domain: wallet
    risk: read
    parameters:
      type: object
      properties: {}
      required: []

  - name: check_name
    description: >-
      Check what the deterministic risk gate will do to a candidate position
      BEFORE you commit it: the volatility-scaled per-name cap, this name's average
      correlation to your current book (highly correlated names get trimmed), and
      the slippage/liquidity cost. Use it to size from calculation instead of guessing.
    handler: valar.tools.handlers.choam_wallet:check_name
    domain: wallet
    risk: read
    parameters:
      type: object
      properties:
        ticker:
          type: string
          description: The universe ticker to check, e.g. NVDA.
        target_pct:
          type: number
          description: Optional intended % of NAV; the cost preview scales to it (default 5).
      required: [ticker]

  - name: check_option
    description: >-
      Inspect a DEFINED-RISK long option (call or put) BEFORE proposing it: the
      indicative premium, what one contract costs against NAV, and the implied max
      loss (the premium). Weigh a convex bet the way check_name weighs an equity.
    handler: valar.tools.handlers.choam_wallet:check_option
    domain: wallet
    risk: read
    parameters:
      type: object
      properties:
        underlying:
          type: string
          description: Universe ticker, e.g. NVDA.
        kind:
          type: string
          enum: [call, put]
          description: call = upside, put = hedge.
        moneyness:
          type: string
          enum: [OTM, ATM, ITM]
          description: Default OTM.
        dte:
          type: integer
          description: Target days-to-expiry (default 35).
        risk_pct:
          type: number
          description: Premium budget as % of NAV = the max loss (default 5).
      required: [underlying, kind]

  # --- Spec'd, disabled until prerequisites land --------------------------------
  # Catalog placeholders (handlers not yet written; enabled: false keeps them out
  # of every registry). Designs: wiki/architecture/harness/tool-catalog.md and
  # proactive-tools-roadmap.md "Design-only handlers".

  # Prerequisite: a running Home Assistant hub + VALAR_HASS_URL / VALAR_HASS_TOKEN.
  - name: hass_call
    description: >-
      Control or check a smart-home device via Home Assistant -- "turn on the
      living room lights", "is the heater on". Resolves friendly device names
      to entity ids.
    handler: valar.tools.handlers.smarthome:hass_call
    domain: smarthome
    risk: control
    enabled: false
    parameters:
      type: object
      properties:
        entity:
          type: string
          description: The device as the user said it, e.g. "living room lamp".
        action:
          type: string
          description: What to do, e.g. "turn_on", "turn_off", "status".
      required: [entity, action]

  # Prerequisite: Google OAuth refresh token (VALAR_GOOGLE_CLIENT_SECRET/TOKEN).
  - name: calendar_today
    description: List today's calendar events with their times.
    handler: valar.tools.handlers.calendar:calendar_today
    domain: calendar
    risk: read
    enabled: false
    parameters:
      type: object
      properties: {}
      required: []

  - name: calendar_next
    description: Get the next upcoming calendar event.
    handler: valar.tools.handlers.calendar:calendar_next
    domain: calendar
    risk: read
    enabled: false
    parameters:
      type: object
      properties: {}
      required: []

  # --- Wright (game-dev reasoning core) -- the orchestrator conductor -----------
  # Runs the five-beat Wright pipeline (Plan, Investigate, Synthesize, Execute,
  # Validate) on a game-design/development task, dispatching each beat to a
  # focused subagent (orchestrator / engine-investigator / reference-investigator
  # / build-executor / validator) through a shared plan file. The engine config +
  # PROJECT GPS are folded in up front as the grounding floor. The real
  # deliverable is the plan file (+ findings/artifacts) it writes under the
  # project's wright/runs dir; the tool returns a short summary + that path. Grant
  # the `gamedev` domain to a driving persona to offer it. Every beat rides the
  # resident QAT except Execute, which swaps to the coder model and evicts the
  # daily model -- do not overlap a full run with live voice-client use (the router
  # restores the daily model on the next daily turn or via its idle watchdog).
  - name: wright
    description: >-
      Hand a game-design or game-development task to Wright, the game-dev
      orchestrator. It runs Plan -> Investigate -> Synthesize -> Execute ->
      Validate across focused subagents, grounded on the live PROJECT GPS, and
      writes a plan file with the design, findings, and build artifacts. engine
      selects the grounding profile (default uefn). stop_after halts the pipeline
      early (e.g. "synthesize" for a design-only run that does not swap the brain).
    handler: valar.tools.handlers.wright:wright
    enabled: true
    domain: gamedev
    risk: read
    speak: Let me bring in Wright.
    parameters:
      type: object
      properties:
        task:
          type: string
          description: The game-design or development task for Wright to work.
        engine:
          type: string
          description: Engine grounding profile to mount, e.g. "uefn" (default) or "unity".
        stop_after:
          type: string
          enum: [plan, investigate, synthesize, execute, validate]
          description: >-
            Halt after this beat (default validate = full pipeline). Use
            "synthesize" for a design-only run that stays on the resident model (no
            brain swap; Execute is the only beat that swaps to the coder model).
        task_id:
          type: string
          description: Stable slug for the run dir (default derived from the task).
        reference_games:
          type: string
          description: >-
            Comma-separated shipped games for the Reference Investigator to study
            for the target mechanic (else VALAR_WRIGHT_REFERENCE_GAMES).
        design_docs:
          type: string
          description: >-
            Comma-separated paths to design docs (e.g. the GSD) to hand the
            Reference Investigator (else VALAR_WRIGHT_DESIGN_DOCS).
      required: [task]

  # --- uefn (Wright editor access) -- bridge to the uefn-mcp listener -----------
  # Gives wright-build / wright-introspect perceive+act access to the LIVE UEFN
  # editor THROUGH Valar: the handler proxies {command,params} to the listener on
  # the Windows host (ports 8780-8785; listener binds 0.0.0.0, firewall-scoped to
  # the WSL subnet). Granted via the `uefn` domain. uefn_python is the workhorse.
  - name: uefn_ping
    description: >-
      Check that the UEFN editor is open and its listener is reachable. Call this
      first; if it fails, the editor or listener is not running.
    handler: valar.tools.handlers.uefn:uefn_ping
    domain: uefn
    risk: read
    parameters:
      type: object
      properties: {}
      required: []

  - name: uefn_get_actors
    description: >-
      List the actors in the current UEFN level (label, class, transform). Use to
      perceive what is placed -- devices, blockout markers, environment. Optional
      class_filter narrows by a class-name substring.
    handler: valar.tools.handlers.uefn:uefn_get_actors
    domain: uefn
    risk: read
    parameters:
      type: object
      properties:
        class_filter:
          type: string
          description: Optional class-name filter, e.g. "Device" or "MovementModulator".
      required: []

  - name: uefn_search_assets
    description: >-
      Search the project's Asset Registry (compiled assets -- incl. Verse classes,
      item definitions, meshes). A device or script ABSENT from the level may still
      exist here, so check this before reporting anything "absent". class_name
      filters by type (e.g. "VerseClass"); directory defaults to "/Game/".
    handler: valar.tools.handlers.uefn:uefn_search_assets
    domain: uefn
    risk: read
    parameters:
      type: object
      properties:
        class_name:
          type: string
          description: Optional class filter, e.g. "VerseClass", "StaticMesh", "Texture2D".
        directory:
          type: string
          description: Content directory to search (default "/Game/").
        recursive:
          type: boolean
          description: Include subdirectories (default true).
      required: []

  - name: uefn_does_asset_exist
    description: >-
      Check whether an asset exists at a given content path. Use to confirm a
      specific item/script/mesh exists rather than inferring from the level.
    handler: valar.tools.handlers.uefn:uefn_does_asset_exist
    domain: uefn
    risk: read
    parameters:
      type: object
      properties:
        asset_path:
          type: string
          description: Asset path to check, e.g. "/Game/Kingmaker/SomeItem".
      required: [asset_path]

  - name: uefn_list_assets
    description: >-
      List assets in a content directory (label + class). Use to enumerate what
      content actually exists on disk/in the project, not just what is placed.
    handler: valar.tools.handlers.uefn:uefn_list_assets
    domain: uefn
    risk: read
    parameters:
      type: object
      properties:
        directory:
          type: string
          description: Content directory (default "/Game/").
        recursive:
          type: boolean
          description: Include subdirectories (default true).
        class_filter:
          type: string
          description: Optional class filter, e.g. "VerseClass", "StaticMesh".
      required: []

  - name: uefn_python
    description: >-
      Run Python in the open UEFN editor with full access to the `unreal` module.
      The workhorse: read the level, spawn/move/configure actors, save the level.
      Assign to a `result` variable to return a value. ADD-ONLY: never delete or
      rename the operator's existing content; save a snapshot before structural changes.
    handler: valar.tools.handlers.uefn:uefn_python
    domain: uefn
    risk: control
    speak: Let me work in the editor.
    parameters:
      type: object
      properties:
        code:
          type: string
          description: Python code to run in the editor. Set `result` to return a value.
      required: [code]

  # --- Mentat v2 conductor (Phase 2.5, 2026-07-20) ---------------------------
  # The coding-loop conductor as a harness tool: start a named run in the
  # background, check on it from any client. Runs are an operator-curated
  # allow-list (mentat_runs.yaml); the model never supplies paths.

  - name: list_cards
    description: >-
      List the UI cards in the workshop -- what each shows and the data it
      carries. Check this BEFORE presenting rich or structured information
      (financial data, charts, tables, places): if a card fits, the system
      uses it; if none can carry the content's visual shape, offer the
      operator a new card (forge_card).
    handler: valar.tools.handlers.forge:list_cards
    domain: projects
    risk: read
    parameters:
      type: object
      properties: {}
      required: []

  - name: compose_view
    description: >-
      Put a composed card on the operator's screen. Use when you are showing
      something with a shape: a calendar or grid, a set of figures, a short
      brief. Check list_cards first, and prefer a purpose-built card if one
      fits. You describe the layout; you never write code.
      A grid is the shape that carries calendars, trackers and seat maps.
      Emit every cell, one object each, with a literal style. There is no loop
      and no condition on purpose: work out which cells are marked before you
      start, then write them out.
    handler: valar.tools.handlers.compose:compose_view
    domain: projects
    risk: read
    speak: Let me put that on the screen.
    parameters:
      type: object
      properties:
        title:
          type: string
          description: A short heading for the card.
        template:
          type: string
          enum: [plain, brief, hero_stat, comparison]
          description: >-
            plain stacks the sections, brief is a short read, hero_stat makes
            the first section large, comparison lays them out in two columns.
        sections:
          type: array
          description: >-
            The layout, in order. Each section has a "kind":
            {"kind":"text","body":"..."};
            {"kind":"stat","label":"...","value":"..."};
            {"kind":"stat_row","stats":[{"label":"...","value":"..."}]};
            {"kind":"image","src":"..."};
            {"kind":"divider"};
            {"kind":"grid","columns":7,"heading":"August 2026","cells":[
            {"text":"S","style":"muted"},{"text":"1","style":"default"},
            {"text":"5","style":"marked"},{"text":"","style":"empty"}]}.
            Cell styles are muted, default, marked, accent, empty.
          items:
            type: object
      required: [sections]

  - name: forge_card
    description: >-
      Commission a NEW UI card from Mentat when NO existing card can carry the
      content's visual shape (charts, meters, rich place details, image
      layouts). Reuse first: if generated_view or another card fits, use that
      instead. The forge scaffolds and registers the card immediately and the
      build runs in the background; always tell the operator what you
      commissioned and ask whether they want it going forward.
    handler: valar.tools.handlers.forge:forge_card
    domain: projects
    risk: write
    speak: Let me commission the workshop.
    parameters:
      type: object
      properties:
        card_name:
          type: string
          description: Short name for the card, e.g. "trading desk" or "place info".
        purpose:
          type: string
          description: One sentence -- what this card shows and when it appears.
        data_fields:
          type: string
          description: >-
            The data the card renders, as name:type pairs, e.g.
            "nav:number, deployed_pct:number, positions:list of ticker+pct".
        visual_elements:
          type: string
          description: >-
            The visual treatment, e.g. "drawdown meter vs 15% halt, position
            rows, big NAV number".
        data_source:
          type: string
          description: >-
            The tool whose data will feed this card (e.g. consult_liara,
            get_weather). Once the card is built, that tool's results render
            through it automatically.
      required: [card_name, purpose]

  - name: mentat_run
    description: >-
      Start a Mentat coding run in the background. Use when the operator asks to
      have Mentat work on, build, or continue a named project run (e.g. "have
      Mentat work the desktop client backlog"). Takes the run NAME only; if the
      name is unknown the result lists the configured runs.
    handler: valar.tools.handlers.mentat:mentat_run
    domain: projects
    risk: write
    speak: Starting a Mentat run.
    parameters:
      type: object
      properties:
        run:
          type: string
          description: >-
            The configured run name, e.g. "desktop-client". Ask the operator if
            unsure; never invent one.
      required: [run]

  - name: mentat_status
    description: >-
      Check the active or most recent Mentat coding run -- whether it is still
      working, finished, blocked, or stalled, and what the last beats did. Use
      for "how's Mentat doing", "is the run done", "mentat status".
    handler: valar.tools.handlers.mentat:mentat_status
    domain: projects
    risk: read
    parameters:
      type: object
      properties: {}
      required: []

  - name: mentat_diagnose
    description: >-
      Get the REAL failure evidence for the current or most recent Mentat run --
      beat results, gate verdicts, executor truncation/stream-drop counts.
      ALWAYS call this BEFORE explaining why a run failed or stalled. Never
      guess or invent causes; report only what this returns.
    handler: valar.tools.handlers.mentat:mentat_diagnose
    domain: projects
    risk: read
    speak: Let me pull the run diagnostics.
    parameters:
      type: object
      properties: {}
      required: []

  - name: mentat_note
    description: >-
      Record guidance for the NEXT Mentat beat (appended to the run's progress
      log, which the next beat reads). This is the ONLY way to steer or "fix"
      a run -- you cannot edit code yourself; never claim you will. Use after
      mentat_diagnose when the operator wants a correction applied.
    handler: valar.tools.handlers.mentat:mentat_note
    domain: projects
    risk: write
    parameters:
      type: object
      properties:
        note:
          type: string
          description: One or two sentences the next beat should know.
        run:
          type: string
          description: Run name; omit for the current run.
      required: [note]

  - name: mentat_retry
    description: >-
      Relaunch the most recent Mentat run from its first unfinished item
      (finished items are never redone). Use after a stall/block once a fix
      or note is in place, or when the operator asks to resume or retry.
    handler: valar.tools.handlers.mentat:mentat_retry
    domain: projects
    risk: write
    speak: Restarting the Mentat run.
    parameters:
      type: object
      properties:
        run:
          type: string
          description: Run name; omit to retry the most recent.
      required: []

  - name: mentat_stop
    description: >-
      Stop the in-flight Mentat run after its current beat completes (never
      mid-edit). Use when the operator asks to stop, pause, or cancel the run.
    handler: valar.tools.handlers.mentat:mentat_stop
    domain: projects
    risk: write
    parameters:
      type: object
      properties: {}
      required: []

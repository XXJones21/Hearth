# Valar tool registry -- the YAML-as-plugin-registry for daily-driver tools.
#
# Mirrors Server/skills/execute/execute.md's task_handlers idiom: each tool is a
# name + a "module:function" handler reference + an OpenAI function-calling schema.
# Adding a tool = one entry here + one handler function (see valar/tools/spec.py).
#
# ADDITIVE / OPT-IN: this registry is built only when HEARTH_TOOLS_ENABLED is set
# (default OFF). It is NOT wired into voice_loop.run_turn; the tool-calling
# round-trip is the separate, opt-in valar.tools.loop.ToolCallingLoop. The working
# voice turn is unchanged until that wiring is added deliberately behind the flag.
#
# Disable any single tool without removing it via `enabled: false`.
#
# Optional `speak:` per tool -- a short thinking-filler phrase the voice loop says
# the moment the brain decides to call the tool, overlapping the handler's
# execution (the ~2s tool-turn gap). One phrase per turn (the first non-empty
# among the called tools). Omit it for fast local tools (timers, remember).
#
# Catalog metadata (2026-06-05; see wiki/architecture/harness/tool-catalog.md):
#   domain:              the tag persona `tool_grants.domains` select on
#   risk:                read | write | control (blast radius; policy hooks)
#   requires_capability: client capability key from client_info needed to offer
#                        the tool on a session (ui_render, device_actions,
#                        spatial); omit for any-client tools.
# Per-session offered set = enabled tools ∩ persona grants ∩ client capabilities.

tools:
  - name: get_weather
    description: >-
      Get the weather for a place -- current conditions + the day's high/low for
      today, or the forecast for tomorrow. Use for ANY weather question -- "what's
      the weather", "what's it like out today", "what about tomorrow", "how hot is
      it", "do I need a jacket", a named city, or the operator's own location from
      context. Always prefer this over answering about weather from general knowledge.
    handler: valar.tools.handlers.weather:current_weather
    domain: weather
    risk: read
    speak: Let me check the weather.
    parameters:
      type: object
      properties:
        location:
          type: string
          description: >-
            City or place name ONLY, e.g. "San Francisco" or "Austin, Texas".
            Never include words like "tomorrow" here -- use the day parameter.
        units:
          type: string
          enum: [imperial, metric]
          description: Temperature units. Default imperial.
        day:
          type: string
          enum: [today, tomorrow]
          description: Which day. Default today. Use tomorrow for forecast questions.
      required: [location]

  # Retired 2026-06-02: time is now AMBIENT CONTEXT (the SCX "Current context"
  # block injects the current local time every turn from the client's timezone),
  # so the brain answers the time directly without a tool call -- more reliable
  # than an 8B deciding to call this (it confabulated the time when it didn't).
  # Kept here, disabled, as a record; delete once the ambient path is proven.
  - name: current_time
    description: Get the current local time and date. Use when the user asks the time or date.
    handler: valar.tools.handlers.timers:current_time
    domain: timers
    risk: read
    enabled: false
    parameters:
      type: object
      properties: {}
      required: []

  - name: create_reminder
    description: >-
      Remind the operator of something at a TIME: "remind me at 6", "tomorrow
      morning", "in two hours". Use for anything beyond the current
      conversation; set_timer is for short countdowns you can hear finish.
      Always say the time back to them. Be honest that it surfaces in
      conversation when due rather than making a sound on its own.
    handler: valar.tools.handlers.reminders:create_reminder
    domain: timers
    risk: write
    parameters:
      type: object
      properties:
        when:
          type: string
          description: >-
            The time, as they said it: "6pm", "tomorrow at 9", "in 2 hours",
            or "2026-08-20 14:30". Do not guess if it was not said.
        text:
          type: string
          description: What to remind them of, in their words.
      required: [when, text]

  - name: list_reminders
    description: List the reminders that are still standing, soonest first.
    handler: valar.tools.handlers.reminders:list_reminders
    domain: timers
    risk: read
    parameters:
      type: object
      properties: {}
      required: []

  - name: dismiss_reminder
    description: >-
      Tick off a reminder once it has been dealt with, so it stops coming up.
      Use when they say done, handled, or drop it.
    handler: valar.tools.handlers.reminders:dismiss_reminder
    domain: timers
    risk: write
    parameters:
      type: object
      properties:
        text:
          type: string
          description: A few words identifying which reminder.
      required: [text]

  - name: manage_routine
    description: >-
      List the standing routines the house runs on a clock, or stop one. Use
      when they ask what it does on its own, or say stop doing X. You cannot
      add a routine this way: each one is code behind a loop, and a heading
      with nothing behind it would be a lie.
    handler: valar.tools.handlers.reminders:manage_routine
    domain: memory
    risk: write
    parameters:
      type: object
      properties:
        action:
          type: string
          enum: [list, remove]
          description: Default list.
        name:
          type: string
          description: Which routine, when removing.
      required: []

  - name: set_timer
    description: >-
      Set a countdown timer. Use for "set a timer for 5 minutes", "remind me in an
      hour". The timer state is recorded; the proactive channel announces it when due.
    handler: valar.tools.handlers.timers:set_timer
    domain: timers
    risk: write
    parameters:
      type: object
      properties:
        duration:
          type: string
          description: Natural duration, e.g. "5 minutes", "1 hour 30 minutes", "90 seconds".
        label:
          type: string
          description: Optional name for the timer, e.g. "pasta" or "laundry".
      required: [duration]

  - name: list_timers
    description: List the active timers and how much time remains on each.
    handler: valar.tools.handlers.timers:list_timers
    domain: timers
    risk: read
    parameters:
      type: object
      properties: {}
      required: []

  - name: cancel_timer
    description: Cancel an active timer by its label.
    handler: valar.tools.handlers.timers:cancel_timer
    domain: timers
    risk: write
    parameters:
      type: object
      properties:
        label:
          type: string
          description: The label of the timer to cancel.
      required: []

  - name: fetch_url
    description: >-
      Open a web page and read it as text. Use when the operator names a link,
      or when web_search returned a result whose page you need to answer
      properly. Public web only. For a local file use read_file.
    handler: valar.tools.handlers.web_search:fetch_url
    domain: search
    risk: read
    speak: Let me open that page.
    parameters:
      type: object
      properties:
        url:
          type: string
          description: The page address.
        max_chars:
          type: integer
          description: Max characters of text to return (default 12000, cap 20000).
      required: [url]

  - name: clipboard
    description: >-
      Read what the operator just copied, or put a result where they can paste
      it. Use when they say "I copied something", "what's on my clipboard", or
      ask you to copy an answer for them.
    handler: valar.tools.handlers.desktop:clipboard
    domain: desktop
    risk: write
    parameters:
      type: object
      properties:
        action:
          type: string
          enum: [read, write]
          description: Default read.
        text:
          type: string
          description: The text to copy, when writing.
      required: []

  - name: draft_email
    description: >-
      Write an email and open it in the operator's mail client for them to
      read and send. NOTHING IS SENT. Pass short instructions describing the
      message, never the finished body. Use when they ask you to write or draft
      an email.
    handler: valar.tools.handlers.desktop:draft_email
    domain: desktop
    risk: write
    speak: Let me draft that.
    parameters:
      type: object
      properties:
        to:
          type: string
          description: Recipient address, if they gave one. Never invent one.
        subject:
          type: string
          description: Subject line.
        instructions:
          type: string
          description: Short brief of what the email should say.
      required: [subject]

  - name: open_path
    description: >-
      Show the operator a file or folder on their screen, in whatever program
      opens it. Use after writing a file, or when they ask to see something.
      Only works for paths under the house's allowed folders.
    handler: valar.tools.handlers.desktop:open_path
    domain: desktop
    risk: control
    parameters:
      type: object
      properties:
        path:
          type: string
          description: Absolute path of the file or folder to open.
      required: [path]

  - name: web_search
    description: >-
      Look up a quick fact or answer on the web (definitions, who/what is X, quick
      facts). Use when the user asks something you do not know or that may have
      changed recently.
    handler: valar.tools.handlers.web_search:web_search
    domain: search
    risk: read
    speak: One moment while I look that up.
    parameters:
      type: object
      properties:
        query:
          type: string
          description: The search query.
      required: [query]

  - name: news_headlines
    description: Get a brief summary of current news, optionally about a topic.
    handler: valar.tools.handlers.web_search:news_headlines
    domain: news
    risk: read
    speak: Let me check the headlines.
    parameters:
      type: object
      properties:
        topic:
          type: string
          description: Optional topic to focus the news on, e.g. "technology" or "sports".
      required: []

  - name: read_file
    description: >-
      Read the text of a local file the operator named by path. Use when they
      point at a resume, note, HTML page, PDF, or similar and ask you to review
      or summarize it. Prefer this over asking them to paste. Paths must sit
      under the house's allowed folders, or a folder the operator approved on
      the permission card. If they name a directory, call list_dir first, then
      read_file on each file you need.
      For deep Engram questions without a path, prefer recall / consult_memory.
    handler: valar.tools.handlers.files:read_file
    domain: files
    risk: read
    speak: Let me read that file.
    parameters:
      type: object
      properties:
        path:
          type: string
          description: Absolute Windows or WSL path the operator provided.
        offset:
          type: integer
          description: Character offset into the extracted text (default 0).
        max_chars:
          type: integer
          description: Max characters to return (default 12000, cap 20000).
      required: [path]

  - name: list_dir
    description: >-
      List the files and subfolders in a local directory the operator named.
      Use when they point at a folder and ask what is in it, or when you need
      the names before calling read_file. If the folder is outside the house's
      allowed roots, a permission card is shown; after they approve, call
      list_dir again. Do not invent filenames.
    handler: valar.tools.handlers.files:list_dir
    domain: files
    risk: read
    speak: Let me see what's in that folder.
    parameters:
      type: object
      properties:
        path:
          type: string
          description: Absolute Windows or WSL path of the directory.
      required: [path]

  - name: search_files
    description: >-
      Find which local files contain a word or phrase, when the operator asks
      where something is written down and does NOT give a path. Returns paths
      with a line number and a snippet; call read_file on whichever one you
      need. Searches only the house's allowed folders. Use this instead of
      guessing a filename or asking them where they put it.
    handler: valar.tools.handlers.files:search_files
    domain: files
    risk: read
    speak: Let me find that.
    parameters:
      type: object
      properties:
        query:
          type: string
          description: The word or phrase to look for. At least two characters.
        root:
          type: string
          description: >-
            Optional root name to narrow the search (for example "career" or
            "engram"). Omit to search all allowed folders.
      required: [query]

  - name: append_file
    description: >-
      Add a line or a few lines to the END of a file that already exists: a
      list, a running note, a log. Pass the text itself. Use this rather than
      write_file whenever the operator wants something added rather than the
      document rewritten.
    handler: valar.tools.handlers.files:append_file
    domain: files
    risk: write
    speak: Let me add that.
    parameters:
      type: object
      properties:
        path:
          type: string
          description: Absolute path of the existing file to add to.
        text:
          type: string
          description: >-
            The exact text to append (max ~4000 chars). Markdown list items
            should include their own "- " prefix.
      required: [path, text]

  - name: move_file
    description: >-
      Move or rename a file the operator named. Pass a bare filename as the
      destination to rename it in place, or a full path to move it. Never
      overwrites: a destination that already exists is refused. Use when they
      say rename, move, or "put that in".
    handler: valar.tools.handlers.files:move_file
    domain: files
    risk: write
    speak: Let me move that.
    parameters:
      type: object
      properties:
        source:
          type: string
          description: Absolute path of the existing file.
        destination:
          type: string
          description: >-
            A bare filename to rename in place ("plan-v2.md"), or an absolute
            path to move it. An existing folder means "into that folder".
      required: [source, destination]

  - name: delete_file
    description: >-
      Delete a single file the operator asked you to delete. ALWAYS shows them
      a card first and waits; you may not delete anything on your own judgment.
      The file is moved to the house trash rather than erased, so it can be
      recovered. Never call this to "clean up" or tidy without being asked.
    handler: valar.tools.handlers.files:delete_file
    domain: files
    risk: write
    speak: ""
    parameters:
      type: object
      properties:
        path:
          type: string
          description: Absolute path of the single file to delete.
      required: [path]

  - name: new_file
    description: >-
      Write a NEW document at a path the operator named: a note, a recipe, a
      list, a plan. Use when they ask you to write something down that does
      not exist yet. Pass the destination path and SHORT instructions saying
      what to write; the harness composes the document. Do NOT pass the body.
      Markdown unless they ask otherwise. If the folder does not exist yet, a
      permission card asks the operator before it is created. To revise a file
      that already exists, use write_file instead.
    handler: valar.tools.handlers.files:new_file
    domain: files
    risk: write
    speak: Let me write that up.
    parameters:
      type: object
      properties:
        path:
          type: string
          description: >-
            Absolute path for the new file, including the filename. Example:
            "D:/Recipes/pumpkin-pie.md". A missing extension becomes .md.
        instructions:
          type: string
          description: >-
            Short brief of what the document should contain (max ~2000 chars).
            Example: "A pumpkin pie recipe: ingredients list, then numbered
            steps, then baking time and temperature."
      required: [path, instructions]

  - name: write_file
    description: >-
      Draft a NEW file beside an existing source the operator named. Pass only
      source + short instructions (what to change). Do NOT pass the draft body:
      the harness re-reads the source and writes the file. HTML/PDF sources
      save as *-draft.md. Text sources keep their type. Never claim a draft was
      saved unless this tool returns "Wrote draft:". After success, speak only
      the path from the tool result.
    handler: valar.tools.handlers.files:write_file
    domain: files
    risk: write
    speak: Let me draft something up.
    parameters:
      type: object
      properties:
        source:
          type: string
          description: Absolute Windows or WSL path of the existing file to draft from.
        instructions:
          type: string
          description: >-
            Short revision brief (max ~2000 chars). Example: "Reframe for Forward
            Deployed Engineer; emphasize production AI systems; keep contact block."
        dest_name:
          type: string
          description: >-
            Optional filename only (same folder). HTML/PDF sources require .md;
            other sources keep the source extension. Omit to auto-name
            <stem>-draft.<ext>.
      required: [source, instructions]

  - name: forget
    description: >-
      Remove or correct one stored fact about the operator. Use when they say
      that is wrong, forget that, or correct something you remembered. Pass a
      few words identifying the fact; pass replace_with to correct it instead
      of deleting it. If several facts match, it lists them and changes
      nothing: ask which one.
    handler: valar.tools.handlers.memory:forget
    domain: memory
    risk: write
    parameters:
      type: object
      properties:
        fact:
          type: string
          description: A few words identifying the stored fact.
        replace_with:
          type: string
          description: Optional corrected wording. Omit to remove the fact entirely.
      required: [fact]

  - name: search_journal
    description: >-
      Search past conversations for a word or phrase and return the sessions
      that mention it, with dates. Use for "when did we talk about X", "what
      did I say about Y", or to find the conversation before answering from
      it. For facts about the operator prefer recall; this is for finding a
      CONVERSATION.
    handler: valar.tools.handlers.memory:search_journal
    domain: memory
    risk: read
    speak: Let me look back through our conversations.
    parameters:
      type: object
      properties:
        query:
          type: string
          description: Word or phrase to look for.
        limit:
          type: integer
          description: Maximum sessions to return (default 8, cap 20).
      required: [query]

  - name: session_summary
    description: >-
      Write up the CURRENT conversation into the Journal now, without ending
      it. Use when they say save this, write this down, or keep a record of
      this conversation. The conversation continues afterwards.
    handler: valar.tools.handlers.session_persist:session_summary
    domain: memory
    risk: write
    speak: Let me write this up.
    parameters:
      type: object
      properties: {}
      required: []

  - name: list_projects
    description: >-
      List the projects in the operator's second brain, most recently touched
      first. Use before update_project, or when they ask what they are working
      on. Never invent a project name.
    handler: valar.tools.handlers.projects:list_projects
    domain: brain
    risk: read
    parameters:
      type: object
      properties: {}
      required: []

  - name: update_project
    description: >-
      Add a decision or a note to a project in the second brain. Use when a
      conversation settles something worth keeping. Write the decision itself,
      not the conversation around it. If the name is ambiguous it lists the
      matches and writes nothing.
    handler: valar.tools.handlers.projects:update_project
    domain: brain
    risk: write
    speak: Let me note that down.
    parameters:
      type: object
      properties:
        project:
          type: string
          description: Project name or folder slug, as returned by list_projects.
        note:
          type: string
          description: The decision or note to record (max ~1000 chars).
        section:
          type: string
          enum: [decisions, notes]
          description: Which heading to append under. Default decisions.
      required: [project, note]

  - name: remember
    description: >-
      Store a durable fact about the user for later (in long-term memory). Use when
      the user says "remember that...", "don't forget...", or shares a lasting preference.
    handler: valar.tools.handlers.memory:remember
    domain: memory
    risk: write
    parameters:
      type: object
      properties:
        fact:
          type: string
          description: The fact to store, phrased as a standalone statement.
      required: [fact]

  - name: consult_memory
    description: >-
      Ask Selene, the memory librarian, to research a question in the
      operator's full long-term memory and notes (career history, past
      sessions, projects, life context) and report back a synthesis. Use for
      DEEP or multi-part questions about the operator's past -- "what did I
      work on at...", "summarize my time at...", "tell me about my history
      with...". For a single quick fact, use recall instead.
    handler: valar.tools.handlers.consult:consult_memory
    domain: memory
    risk: read
    speak: Let me check my library.
    parameters:
      type: object
      properties:
        question:
          type: string
          description: The full question to research in the operator's memory.
        scope:
          type: string
          enum: [background, personal_projects, sessions, all]
          description: >-
            The question's intent. background = career, employers, jobs,
            education, life history (the default) -- INCLUDING anything
            worked on AT an employer (Meta, Apple, Snap...). personal_projects
            = the operator's own side projects only. sessions = past
            conversations.
      required: [question]

  - name: recall
    description: >-
      Quick search of the operator's long-term memory: saved personal facts,
      session diaries, project notes, background knowledge. Use for a SINGLE
      specific fact or detail -- "what did I tell you about...", "do you
      remember my...". Scope the search by INTENT: background for career,
      employers, jobs, education, life history; projects for the operator's
      project work; sessions for past conversations. For deep or multi-part
      questions about the operator's past, use consult_memory instead. Prefer
      either over guessing or answering from general knowledge.
    handler: valar.tools.handlers.memory:recall
    domain: memory
    risk: read
    speak: Let me think back.
    parameters:
      type: object
      properties:
        query:
          type: string
          description: What to search memory for. Omit to list recent stored facts.
        scope:
          type: string
          enum: [all, background, personal_projects, sessions]
          description: >-
            Search intent. background = career, employers, jobs, education,
            life history -- INCLUDING anything worked on AT an employer
            (Meta, Apple, Snap...). personal_projects = the operator's own
            side projects only. sessions = past conversations. Default all.
        max_results:
          type: integer
          description: How many results to read (1-10). Default 5.
      required: []

  - name: generate_image
    description: >-
      Draw or generate an image from a description using the local art studio.
      Use for "draw me...", "generate an image of...", "make a picture...".
      The picture appears on the operator's screen by itself when it is
      finished, a minute or two later. Say it is underway; never claim it is
      already done, and never offer to fetch it.
    handler: valar.tools.handlers.imagery:generate_image
    domain: media
    risk: write
    speak: Let me set up the easel.
    parameters:
      type: object
      properties:
        prompt:
          type: string
          description: What to draw, as a rich visual description.
        orientation:
          type: string
          enum: [landscape, portrait, square]
          description: Canvas shape. Default landscape.
      required: [prompt]

  - name: check_image
    description: >-
      Say how the drawing on the easel is coming along. Use ONLY when the
      operator asks out loud ("is it ready", "how is the picture coming").
      The screen does not need this: the picture arrives there on its own.
    handler: valar.tools.handlers.imagery:check_image
    domain: media
    risk: read
    parameters:
      type: object
      properties: {}
      required: []

  - name: consult_claude
    description: >-
      Hand a coding, research, or writing task to Claude Code, the frontier
      agent. Use for work that needs real file-level execution or judgment
      beyond a single answer: "have Claude build X", "get Claude to look at
      Y", "ask Claude to draft Z". Prefer mentat_run for beats against an
      existing plan; this is for one-off work with no plan. Claude works in a
      named workspace only. This STARTS the work and returns immediately --
      it takes about a minute, so tell the operator it is underway and use
      claude_status to report what it found.
    handler: valar.tools.handlers.claude_code:consult_claude
    domain: dev
    risk: write
    speak: Let me put Claude on that.
    parameters:
      type: object
      properties:
        task:
          type: string
          description: >-
            The task to hand over, written as an instruction to a capable
            engineer. Include everything it needs; it does not see this
            conversation.
        workspace:
          type: string
          enum: [scratch, valinor]
          description: >-
            Where it may work. "scratch" is a sandbox directory (default and
            correct for anything experimental). "valinor" is the live repo;
            only for work the operator explicitly asked to land there.
        mode:
          type: string
          enum: [acceptEdits, plan, dontAsk]
          description: >-
            "acceptEdits" lets it write files (default). "plan" makes it
            propose without changing anything.
      required: [task]

  - name: claude_status
    description: >-
      Check what Claude Code is doing, or read what it reported when it last
      finished. Use after consult_claude, and whenever the operator asks how
      it is going, what Claude found, or whether it is done.
    handler: valar.tools.handlers.claude_code:claude_status
    domain: dev
    risk: read
    parameters:
      type: object
      properties: {}
      required: []

  # --- Spec'd, disabled until prerequisites land --------------------------------
  # Catalog placeholders (handlers not yet written; enabled: false keeps them out
  # of every registry). Designs: wiki/architecture/harness/tool-catalog.md and
  # proactive-tools-roadmap.md "Design-only handlers".

  # Prerequisite: a running Home Assistant hub + HEARTH_HASS_URL / HEARTH_HASS_TOKEN.
  - name: hass_call
    description: >-
      Control or check a smart-home device via Home Assistant -- "turn on the
      living room lights", "is the heater on". Resolves friendly device names
      to entity ids.
    handler: valar.tools.handlers.smarthome:hass_call
    domain: smarthome
    risk: control
    enabled: false
    parameters:
      type: object
      properties:
        entity:
          type: string
          description: The device as the user said it, e.g. "living room lamp".
        action:
          type: string
          description: What to do, e.g. "turn_on", "turn_off", "status".
      required: [entity, action]

  # Prerequisite: Google OAuth refresh token (HEARTH_GOOGLE_CLIENT_SECRET/TOKEN).
  - name: calendar_today
    description: List today's calendar events with their times.
    handler: valar.tools.handlers.calendar:calendar_today
    domain: calendar
    risk: read
    enabled: false
    parameters:
      type: object
      properties: {}
      required: []

  - name: calendar_next
    description: Get the next upcoming calendar event.
    handler: valar.tools.handlers.calendar:calendar_next
    domain: calendar
    risk: read
    enabled: false
    parameters:
      type: object
      properties: {}
      required: []

  - name: list_cards
    description: >-
      List the UI cards in the workshop -- what each shows and the data it
      carries. Check this BEFORE presenting rich or structured information
      (financial data, charts, tables, places): if a card fits, the system
      uses it; if none can carry the content's visual shape, offer the
      operator a new card (forge_card).
    handler: valar.tools.handlers.forge:list_cards
    domain: workshop
    risk: read
    parameters:
      type: object
      properties: {}
      required: []

  - name: compose_view
    description: >-
      Put a composed card on the operator's screen. Use when you are showing
      something with a shape: a calendar or grid, a set of figures, a short
      brief. Check list_cards first, and prefer a purpose-built card if one
      fits. You describe the layout; you never write code.
      A grid is the shape that carries calendars, trackers and seat maps.
      Emit every cell, one object each, with a literal style. There is no loop
      and no condition on purpose: work out which cells are marked before you
      start, then write them out.
    handler: valar.tools.handlers.compose:compose_view
    domain: workshop
    risk: read
    speak: Let me put that on the screen.
    parameters:
      type: object
      properties:
        title:
          type: string
          description: A short heading for the card.
        template:
          type: string
          enum: [plain, brief, hero_stat, comparison]
          description: >-
            plain stacks the sections, brief is a short read, hero_stat makes
            the first section large, comparison lays them out in two columns.
        sections:
          type: array
          description: >-
            The layout, in order. Each section has a "kind":
            {"kind":"text","body":"..."};
            {"kind":"stat","label":"...","value":"..."};
            {"kind":"stat_row","stats":[{"label":"...","value":"..."}]};
            {"kind":"image","src":"..."};
            {"kind":"divider"};
            {"kind":"grid","columns":7,"heading":"August 2026","cells":[
            {"text":"S","style":"muted"},{"text":"1","style":"default"},
            {"text":"5","style":"marked"},{"text":"","style":"empty"}]}.
            Cell styles are muted, default, marked, accent, empty.
          items:
            type: object
      required: [sections]

  - name: choice_card
    description: >-
      Offer the operator a small set of options YOU wrote, rendered as
      choices beside their free-text composer. Use when a question is hard
      to answer cold and examples would help them think. Compose the options
      from what this conversation has already taught you; never a generic
      list. Their typed answer always outranks the choices. After calling
      this, wait for their reply; do not answer for them. ALWAYS send both
      fields, e.g. {"question": "What are they for?", "options": [{"label":
      "A calm planner", "detail": "keeps your days in order"}, {"label": "A
      witty companion", "detail": "keeps you company"}]}. A call without
      options renders nothing.
    handler: valar.tools.handlers.choice:choice_card
    domain: workshop
    risk: read
    speak: ""
    parameters:
      type: object
      properties:
        question:
          type: string
          description: The question the options answer, exactly as you asked it.
        options:
          type: array
          description: >-
            Two to five options, each {"label":"a few words",
            "detail":"one short line of what choosing it means"}.
          items:
            type: object
        allow_free_text:
          type: boolean
          description: Almost always true; false only for a strict either-or.
      required: [question, options]

  - name: start_project
    description: >-
      Give the person's memory its first real thing. Call this ONCE, only when
      they have named something they are actually working on. Not a category,
      not an example, not something you suggested -- their own answer. After it
      returns, tell them where it lives and stop.
    handler: valar.tools.handlers.second_brain:start_project
    domain: brain
    risk: write
    speak: ""
    parameters:
      type: object
      properties:
        name:
          type: string
          description: What they are working on, in their words. A short title.
        note:
          type: string
          description: >-
            One or two lines of what it is, from what they told you. Their
            framing, not a summary of the feature.
      required: [name]

  - name: import_brain
    description: >-
      Bridge the house to a second brain the person ALREADY has. Call it only
      with the exact folder path they gave you, never one you guessed or
      remembered. Until this returns ok, no connection of any kind exists,
      and you must not claim one.
    handler: valar.tools.handlers.second_brain:import_brain
    domain: brain
    risk: write
    speak: ""
    parameters:
      type: object
      properties:
        path:
          type: string
          description: >-
            The full path they gave, exactly as they gave it (for example
            D:/Tools/Valinor/Engram). Absolute paths only.
      required: [path]

  - name: complete_brain_setup
    description: >-
      Finish second-brain setup without a first project, when the person
      declines or says they are done. Closes the setup and frees them to go
      to the house. Takes nothing.
    handler: valar.tools.handlers.second_brain:complete_brain_setup
    domain: brain
    risk: write
    speak: ""
    parameters:
      type: object
      properties: {}
      required: []

  - name: create_persona
    description: >-
      Create a new persona from what the conversation taught you. Call this
      ONCE, only when you could describe this person to someone else: their
      purpose, their temperament, how they should sound, their colour. You
      write the system prompt IN THEIR VOICE, not yours. After it returns,
      stop: the new persona speaks next, not you.
    handler: valar.tools.handlers.creation:create_persona
    domain: personas
    risk: write
    speak: ""
    parameters:
      type: object
      properties:
        name:
          type: string
          description: What they will be called. A letter first, under 24 characters.
        description:
          type: string
          description: One line of who they are, for the persona page.
        system_prompt:
          type: string
          description: >-
            Their full system prompt, written in THEIR voice from everything
            the conversation established. Their purpose, their temperament,
            how they speak.
        temperament:
          type: string
          description: A short phrase, e.g. "dry, patient".
        voice_design:
          type: array
          description: >-
            Voice attributes chosen from exactly this vocabulary, two to four
            of them: female, male; child, teenager, young adult, middle-aged,
            elderly; very low pitch, low pitch, moderate pitch, high pitch,
            very high pitch; whisper; american/australian/british/canadian/
            chinese/indian/japanese/korean/portuguese/russian accent.
          items:
            type: string
        colour:
          type: string
          description: >-
            A hex colour like #5B7C99, or a swatch name (Ember, Tide, Fern,
            Heather, Clay). It becomes their whole look.
      required: [name, description, system_prompt, temperament, colour]

  - name: forge_card
    description: >-
      Commission a NEW UI card from Mentat when NO existing card can carry the
      content's visual shape (charts, meters, rich place details, image
      layouts). Reuse first: if generated_view or another card fits, use that
      instead. The forge scaffolds and registers the card immediately and the
      build runs in the background; always tell the operator what you
      commissioned and ask whether they want it going forward.
    handler: valar.tools.handlers.forge:forge_card
    domain: workshop
    risk: write
    speak: Let me commission the workshop.
    parameters:
      type: object
      properties:
        card_name:
          type: string
          description: Short name for the card, e.g. "trading desk" or "place info".
        purpose:
          type: string
          description: One sentence -- what this card shows and when it appears.
        data_fields:
          type: string
          description: >-
            The data the card renders, as name:type pairs, e.g.
            "nav:number, deployed_pct:number, positions:list of ticker+pct".
        visual_elements:
          type: string
          description: >-
            The visual treatment, e.g. "drawdown meter vs 15% halt, position
            rows, big NAV number".
        data_source:
          type: string
          description: >-
            The tool whose data will feed this card (e.g. consult_liara,
            get_weather). Once the card is built, that tool's results render
            through it automatically.
      required: [card_name, purpose]


# Standalone rather than a member of the repository root workspace. The root
# workspace covers the client and the probe, which build for the host; this
# crate builds for the Linux side of the product tree and keeps its own
# lockfile, exactly as it did in Valinor.
[workspace]

[package]
name = "hearth-supervisor"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
idna_adapter = "=1.0.0"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21", default-features = false, features = ["connect", "handshake"] }
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "=2.5.4"
uuid = { version = "1", features = ["v4"] }

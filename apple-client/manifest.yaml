  - name: timeline
    source: Valinor/Views/Timeline/TimelineFeed.swift
    destination: Core/Sources/HearthUI/Surfaces/Timeline/TimelineFeed.swift
    area: 4
    target: ui
    lines: 283
    disposition: edits
    note: "the interleaved transcript feed; transcript history is the card model. One 'Sulivan' fallback."

  - name: settings-surface
    source: Valinor/Views/Settings/HearthSettingsView.swift
    destination: Core/Sources/HearthUI/Surfaces/Settings/HearthSettingsView.swift
    area: 4
    target: ui
    lines: 402
    disposition: edits
    note: >-
      Connection is the section that matters most on a phone, and its behaviour
      carries across unchanged because it was reasoned once already: Apply means
      redial, because the socket only reads the address when it dials; Test
      probes what is typed and then rolls back, so a bad address cannot take the

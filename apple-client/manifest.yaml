# The Apple client manifest.
#
# The boundary in machine-readable form: every file in Valinor's Apple client,
# where it lands here, which area lands it, which target owns it, and what
# happened to it on the way. Written before anything is copied, so the copy is a
# script rather than seventy-nine judgment calls.
#
# Four readers depend on this file:
#   - tools/apple-scrub.py, which iterates it to copy and rewrite
#   - tools/sync-report.py --manifest, which asks Valinor what has changed
#   - the `git ls-files apple-client | wc -l` gate, which counts against it
#   - a reviewer, deciding whether the right files moved
#
# `disposition` is one of:
#   verbatim   copied byte for byte, no edit of any kind
#   edits      copied, then changed by the scrub's substitution tables or by a
#              named subtraction. Every `edits` row says what changed.
#   generated  does not exist in Valinor; authored here
#   excluded   deliberately did not cross; see the `excluded` section
#
# `target` is one of: core | ui | spatial | ios | visionos | widgets
#   The first three are libraries in the local Swift package; the last three are
#   Xcode targets. The layer is the library:
#     core     HearthCore -- models, transport, audio, config, view models, and
#              the brand palette, which is here rather than in ui because it is
#              the single source for both the SwiftUI Color and the SIMD3 scene
#              value, and PersonaPalette in this layer reads the latter.
#     ui       HearthUI -- the SwiftUI both platforms render: the card library,
#              the persona chrome, and the surfaces (settings, persona, apps,
#              journal, timeline, sessions).
#     spatial  HearthSpatial -- the RealityKit both platforms will render.
#              Empty until phase 1 of the Vision design.
#   That split is what replaces Valinor's membershipExceptions mechanism, and it
#   is why sharing a new type here is a `public` keyword rather than a
#   project-file edit.
#
# See wiki/clients/apple-implementation.md for the reasoning behind every
# decision encoded below. This file is the decisions; that file is the argument.

version: 1

source:
  repo: Valinor
  path: /Users/jones/Valinor
  root: Apple Client/Valinor/
  # NOT hearth-journal, which the inventory and migration plan both name. Every
  # candidate branch is 0 commits ahead of this one over Apple Client/, and
  # hearth-journal is behind it by the drawing card.
  branch: hearth-ios
  commit: 9235cd0
  tag: rc-pre-apple-move
  surveyed_on: 2026-08-08

destination:
  root: apple-client/Hearth/

# The strings that must agree with themselves across two or three files, and
# every disagreement is silent. The scrub reads its substitutions from here and
# never from constants in the script.
identity:
  bundle_id_ios:      com.joshuajones.Hearth
  bundle_id_widgets:  com.joshuajones.Hearth.Widgets  # must be prefixed by its host
  bundle_id_visionos: com.joshuajones.HearthVision
  app_group:          group.com.joshuajones.Hearth    # one group, both platforms
  url_scheme:         hearth
  default_port:       18700
  # Deliberately empty. A phone is never the machine running the backend, so
  # neither 127.0.0.1 nor a LAN literal is honest. Unset is a distinct state and
  # the app in that state does not dial: it renders the bundled Sulivan and
  # shows the connection field.
  default_host:       ""
  development_team_var: DEVELOPMENT_TEAM   # lives in Local.xcconfig, gitignored

# Applied to every crossing file. Type and filename rename in the same pass:
# Swift does not require them to match, which is exactly why a half-done rename
# survives review.
renames:
  types:
    ValinorApp:              HearthApp
    ValinorMainView:         HearthMainView
    ValinorState:            HearthState
    ValinorWebSocketClient:  HearthWebSocketClient
    ValinorWidgetsExtension: Hearth WidgetExtension   # the target's real name
    ValinorWidgetProvider:   HearthWidgetProvider
    ValinorWidgetsBundle:    HearthWidgetsBundle
    ValinorWidgets:          Hearth Widget            # the folder's real name
    ValinorSnapshot:         HearthSnapshot
    ValinorProvider:         HearthProvider
    ValinorEntry:            HearthEntry
    SulivanWidget:           PersonaWidget
    AudioInputManager:       AudioSessionManager
  # UserDefaults keys. Renaming is correct for a product that has never shipped
  # and strands nothing; after release it would need a migration.
  defaults_keys:
    valinor_server_ip:       hearth.serverHost
    valinor_server_port:     hearth.serverPort
    valinor_last_persona:    hearth.lastPersona
    valinor_inference_mode:  DROP        # goes with OnDevice/
    valinor.snapshot.v1:     hearth.snapshot.v1
  # Widget kind strings are one-way: changing one after release orphans every
  # placed widget. Identifiers, not persona names.
  widget_kinds:
    Sulivan:                 hearth.persona
    QuickTalk:               hearth.quicktalk

# What the scrub must NOT touch.
do_not_rewrite:
  # Already correct. A find-and-replace pass over the word Hearth corrupts them.
  already_hearth:
    - Shared/HearthPalette.swift
    - Shared/HearthIcons.swift
    - Shared/PersonaOrb.swift
    - Shared/PersonaPalette.swift
  # The wire vocabulary is a protocol, not a brand. A rename sweep would happily
  # change these strings and break the server's handling.
  protocol_constants:
    - 'platform: "ios"'
    - 'platform: "visionos"'
    - 'stt: "local"'
    - 'stt_engine: "apple_speech"'
    - ui_render
    - device_context
  # Hand-made on the Mac. A re-scrub must never write over them, which is the
  # boundary that makes re-scrubbing safe for everything else.
  generated_layer:
    - Hearth.xcodeproj/
    - "*/Info.plist"
    - "*.entitlements"
    - "*.xcconfig"

# ---------------------------------------------------------------------------
# Area 1 -- Foundation, and first run
#
# First because it has no dependencies, and first because it is the only area
# whose result a person can judge by looking. At the end of area 1 the app
# launches with nothing listening on any port and draws Sulivan from a persona
# file inside the bundle.
# ---------------------------------------------------------------------------
components:
  - name: core-package
    destination: Core/Package.swift
    area: 1
    target: core
    disposition: generated
    note: >-
      The local package manifest. platforms: iOS 26.0, visionOS 27.0 -- stated
      once here rather than restated across build configurations.

      Swift 5 language mode, NOT Swift 6, and the file says why at length: the
      split this manifest drew put ChatViewModel, TTSStreamPlayer,
      SpeechRecognitionManager and AudioSessionManager all in the package, so
      Swift 6 here would apply strict concurrency to precisely the audio path
      the plan says to leave alone until it has been audited. This note used to
      claim Swift 6; the code was always the correction.

      THREE libraries as of the Vision phase 0, which is the split the original
      "one library to start, not three" note anticipated: HearthCore (logic),
      HearthUI (the SwiftUI both platforms render), HearthSpatial (the
      RealityKit both platforms will render). See the `target` vocabulary at the
      head of this file.

  - name: bundled-persona
    destination: Core/Sources/HearthCore/Resources/Personas/sulivan.json
    area: 1
    target: core
    disposition: generated
    from: backend/personas/Sulivan/sulivan.json
    note: >-
      NET NEW, and the item most likely to be quietly deferred because it looks
      like a port. The Apple client has never bundled a persona: it asks the
      server with get_persona_config and falls back to constants in
      PersonaPalette, so a phone with nothing to talk to shows a palette-default
      orb rather than Sulivan. Decoded by the same PersonaVisualization decoder
      that handles the wire payload, so the fallback reads from the file instead
      of restating its numbers in Swift. This is the whole of the first-run
      claim.

  - name: server-config
    source: Valinor/ServerConfig.swift
    destination: Core/Sources/HearthCore/Config/ServerConfig.swift
    area: 1
    target: core
    lines: 92
    disposition: edits
    note: >-
      defaultPort 8700 -> 18700. defaultHost "10.1.95.5" -> unset, and clearing
      the field must no longer restore a build-time default. Everything else
      about the parser carries across unchanged and was paid for in bugs: strip
      a pasted scheme, split on the rightmost colon only when what follows is a
      real port so an IPv6 literal survives, let a bare hostname imply the
      default port so a tailnet name pastes in cleanly.

  - name: models-wire
    source: Valinor/Models/
    destination: Core/Sources/HearthCore/Models/
    area: 1
    target: core
    kind: directory
    disposition: edits
    files:
      - {from: ChatMessage.swift, to: ChatMessage.swift, lines: 30, disposition: edits}
      - from: ClientInfo.swift
        to: ClientInfo.swift
        lines: 142
        disposition: edits
        note: "client_info payload keys are protocol constants and do not rename"
      - {from: ServerMessage.swift, to: ServerMessage.swift, lines: 152, disposition: edits}
      - from: ValinorState.swift
        to: HearthState.swift
        lines: 17
        disposition: edits
        note: "referenced across ~12 files including the widgets; rename type and file together"
      - {from: SettingsSurface.swift, to: SettingsSurface.swift, lines: 92, disposition: edits}
      - {from: AppsSurface.swift, to: AppsSurface.swift, lines: 178, disposition: edits}
      - from: PersonaSurface.swift
        to: PersonaSurface.swift
        lines: 296
        disposition: edits
        note: >-
          Filters internal personas by the server's `internal` flag rather than
          by name, which is the right design and needs no change. Its comments
          name Liara, Mentat, Wright and Sage as examples; those are comments,
          not coupling, and the scrub deletes the sentences rather than the
          logic.
      - from: JournalModels.swift
        to: JournalModels.swift
        lines: 252
        disposition: edits
        note: >-
          Strip the seeded keeper summaries for the three living volumes, which
          bake persona "Selene" in as content. Development fixtures that render
          as product.
      - {from: MentatState.swift, to: null, lines: 99, disposition: excluded}

  - name: brand
    source: Valinor/Shared/
    destination: Core/Sources/HearthCore/Brand/
    area: 1
    target: core
    kind: directory
    disposition: verbatim
    files:
      - {from: ColorHex.swift, to: ColorHex.swift, lines: 54, disposition: edits}
      - from: HearthPalette.swift
        to: HearthPalette.swift
        lines: 237
        disposition: edits
        note: >-
          Already correct. Writes each token once as a hex literal and decodes
          it into both a SwiftUI Color and a SIMD3<Float>, so the flat and
          RealityKit renderers cannot drift. Only the access modifiers change.
  - name: brand-ui
    source: Valinor/Shared/
    destination: Core/Sources/HearthUI/Brand/
    area: 1
    target: ui
    kind: directory
    disposition: edits
    files:
      - from: HearthIcons.swift
        to: HearthIcons.swift
        lines: 133
        disposition: edits
        note: "the desktop's icons.tsx redrawn as SwiftUI shapes on the same 24-unit grid"
      - to: NavigationCompat.swift
        disposition: generated
        note: >-
          The one compatibility shim in HearthUI, and it should stay the only
          one. navigationBarTitleDisplayMode is iOS and tvOS only and appeared
          ten times across the surfaces; the guard is written once here and the
          call sites say .hearthNavigationTitleInline() instead of naming a
          platform. A SECOND shim in this file is the signal that the surface
          asking for it is iOS-shaped and belongs back in the app target.
    note: >-
      Split from `brand` when the package became three libraries. Shapes are
      view code and land in ui; ColorHex and HearthPalette stay in core because
      PersonaPalette reads HearthPalette.Scene and core cannot reach up.

  - name: persona
    source: Valinor/Shared/
    destination: Core/Sources/HearthCore/Persona/
    area: 1
    target: core
    kind: directory
    disposition: edits
    files:
      - from: PersonaPalette.swift
        to: PersonaPalette.swift
        lines: 103
        disposition: edits
        note: >-
          `fallback` is currently a set of warm constants written in Swift -- a
          second copy of the numbers in sulivan.json in a different language,
          free to drift. It reads from the bundled file instead.
      - from: PersonaVisualization.swift
        to: PersonaVisualization.swift
        lines: 90
        disposition: edits
        note: >-
          The renderer switch is properly data-driven: it decodes
          visualization.type and nothing anywhere says "if Selene". Preserve
          exactly.

  - name: persona-ui
    source: Valinor/Shared/
    destination: Core/Sources/HearthUI/Persona/
    area: 1
    target: ui
    kind: directory
    disposition: edits
    files:
      - {from: PersonaOrb.swift, to: PersonaOrb.swift, lines: 231, disposition: edits}
    note: >-
      Split from `persona` when the package became three libraries. The flat
      Canvas renderer is view code; the palette and the visualization decoder it
      reads are model code and stay in core.

      One subtraction on the way out: the `Color.rgba` extension went down to
      core's ColorHex.swift, because HearthPalette.mixed(with:amount:) needs it
      and core cannot reach up into ui.

  - name: client-profile
    source: Valinor/Shared/ClientProfile.swift
    destination: Core/Sources/HearthCore/Config/ClientProfile.swift
    area: 1
    target: core
    lines: 63
    disposition: edits
    note: "the Swift mirror of clientProfile.ts; already knows four clients by table"

  - name: widget-bridge
    source: Valinor/Shared/SharedSnapshot.swift
    destination: Core/Sources/HearthCore/Widgets/SharedSnapshot.swift
    area: 1
    target: core
    lines: 78
    disposition: edits
    note: >-
      appGroupID is a hand-typed literal today, and it is one of three copies of
      a string whose disagreement compiles, signs, installs and runs -- the
      widget reads an empty container and draws its fallback orb, which is
      indistinguishable from a widget that is working and waiting. Generated
      into the build from $(HEARTH_APP_GROUP) so the count of hand-maintained
      copies is one. The snapshot key renames to hearth.snapshot.v1.

  - name: ios-app-entry
    source: Valinor/ValinorApp.swift
    destination: Hearth/HearthApp.swift
    area: 1
    target: ios
    lines: 96
    disposition: edits
    note: >-
      Splits. The visionOS scenes behind `#if os(visionOS)` become
      visionOS/HearthVisionApp.swift in area 6, and this keeps the iOS scene
      only. The Wearables.configure() call in init goes with MWDAT, and
      handleOpenURL loses the interception it only needed because MWDAT owned
      the same URL scheme -- it now handles hearth://talk and nothing else.
      Debug prefix [ValinorApp] -> [HearthApp].

  - name: ios-assets
    source: Valinor/Assets.xcassets/
    destination: Hearth/Assets.xcassets/
    area: 1
    target: ios
    kind: directory
    disposition: verbatim
    note: >-
      Crosses as a directory. Contains only Contents.json: AppIcon has three
      declared 1024px slots with no image files and AccentColor is an empty
      colorset. App icons are a known open item, not a migration one, and the
      desktop client is in the same state.

# ---------------------------------------------------------------------------
# Area 2 -- Transport and voice
#
# The shared protocol layer. Second because everything above it needs the wire
# types and nothing in it needs a view. The two clients' agreement lives here,
# so it lands before anything that could disagree with it.
# ---------------------------------------------------------------------------
  - name: transport
    source: Valinor/ValinorWebSocketClient.swift
    destination: Core/Sources/HearthCore/Transport/HearthWebSocketClient.swift
    area: 2
    target: core
    lines: 660
    disposition: edits
    note: >-
      The protocol is the product; rename only, plus the "Valinor" fallback for
      an unnamed reply, which currently attributes it to "Valinor". One
      URLSessionWebSocketTask, receive loop started before client_info, 5s
      handshake timeout, exponential backoff to a 30s ceiling, binary frames
      over 1MB rejected rather than closing the socket. None of that changes.

  - name: stt
    source: Valinor/SpeechRecognitionManager.swift
    destination: Core/Sources/HearthCore/Audio/SpeechRecognitionManager.swift
    area: 2
    target: core
    lines: 192
    disposition: edits
    note: >-
      On-device STT is a product claim, not a convenience:
      requiresOnDeviceRecognition = true, partial results, a 1.5s silence timer
      to finalise what the recogniser will not, errors 203 and 216 swallowed. No
      audio leaves the phone.

  - name: tts-stream
    source: Valinor/TTSStreamPlayer.swift
    destination: Core/Sources/HearthCore/Audio/TTSStreamPlayer.swift
    area: 2
    target: core
    lines: 255
    disposition: edits
    note: >-
      float32 LE mono PCM onto an AVAudioPlayerNode that never stops between
      sentences, end of playback detected with a 50ms silent sentinel buffer,
      and the frame-offset marks that make captions follow what is heard rather
      than what has arrived. Debug prefix [TTS] kept.

  - name: audio-session
    source: Valinor/AudioInputManager.swift
    destination: Core/Sources/HearthCore/Audio/AudioSessionManager.swift
    area: 2
    target: core
    lines: 234
    disposition: edits
    note: >-
      Only the session config survives. configureForGlasses(_:) owns the
      AVAudioSession category and mode and is called from three places, so it is
      load-bearing and is renamed to something honest now that the glasses are
      out. The 48kHz-to-16kHz capture and upload path does not cross:
      startStreaming() has no caller anywhere in the tree. The file is renamed
      because after the subtraction it no longer manages audio input.

# ---------------------------------------------------------------------------
# Area 3 -- The turn and the cards
#
# These land together because ChatViewModel owns CardStore as a nested
# observable and the card views read the view model back. Splitting them
# produces an area that cannot compile, and an area that cannot compile is an
# area whose gate does not run. The largest single landing and the one to watch.
# ---------------------------------------------------------------------------
  - name: chat-view-model
    source: Valinor/ViewModels/ChatViewModel.swift
    destination: Core/Sources/HearthCore/ViewModels/ChatViewModel.swift
    area: 3
    target: core
    lines: 1386
    disposition: edits
    note: >-
      The state machine, and the hub every later area attaches to. LANDED
      2026-08-08; this note is now a record rather than a forecast, and it was
      wrong in four places worth keeping (see apple-implementation.md, "What
      area 3 did by hand"):

      - The "Mentat poll" is not in this file. grep -ci mentat over
        ChatViewModel returns 0. It is in HouseStatusBar (area 4), where it is
        a MentatStatePoller @StateObject started in onAppear -- this note was
        simply filed against the wrong file. Removed there, not here.
      - The six seeded journal fixtures were real and did carry real dates and
        summaries. Replaced with two obvious placeholders, not deleted, so the
        gallery layout stays testable without shipping a week of real work.
      - The TTSAudioPlayer fallback is five sites, not two: also the
        onSpeakingComplete branch, onAudioResponseReceived, and
        handleAudioResponse. currentResponseUsedPCM went with them.
      - The MWDAT lifecycle is 50 references and two whole MARK: sections, and
        removing it changes the initializer's shape: init(wearables:) -> init().

      One subtraction was missing from this note entirely: on-device inference
      is on the excluded list, so InferenceRouter, LocalModelManager,
      OnDeviceInferenceEngine and PersonaStore all had to come out of here too
      -- setupLocalMode, runLocalInference, toggleInferenceMode, and two mode
      branches. PersonaStore's one live use, remembering the last persona, is
      now a UserDefaults key rather than an excluded file dragged across to
      carry a single preference.

      The scrub's blanket rule is word-anchored, so it renames the TYPE
      ValinorState and leaves the PROPERTY valinorState alone: 32 survivors,
      the most-referenced name in the file. Renamed to hearthState by hand.

  - name: cards
    source: Valinor/Views/Dynamic/
    destination: Core/Sources/HearthCore/Cards/
    area: 3
    target: core
    kind: directory
    disposition: edits
    files:
      - from: CardStore.swift
        to: CardStore.swift
        lines: 136
        disposition: edits
        note: "upsert, clear and clear_all plus per-instance TTL, appending a new instance per upsert and capping at 40"
      - from: UiComponentDescriptor.swift
        to: UiComponentDescriptor.swift
        lines: 164
        disposition: edits
        note: >-
          The tolerant decoder: unknown keys ignored, numbers accepted as int,
          double or string, only a missing type or an unknown version fatal.
          Drop the two commissioned type constants at :41 and :42. Their absence
          is silent and correct precisely because the decoder is tolerant.
          Note there are TWO commissioned types, not one: the cards row below
          names choam_portfolio_dashboard and misses ticker_insight_card sitting
          on the next line. Both are gone, and DynamicComponent dispatched both.

          One addition since the move: `.hearthChoicePicked` is declared at the
          foot of this file. It was in ActionCards.swift, which is now in ui,
          and the observer is ChatViewModel here in core -- a notification name
          is the contract between poster and observer and belongs to the layer
          both can see. That also matches where the other two names live,
          beside ServerConfig and SessionModels.
      - {from: EaselStore.swift, to: EaselStore.swift, lines: 165, disposition: edits}
    note: >-
      Split when the package became three libraries: the store, the descriptor
      and the easel are model code and stay in core. The card VIEWS moved to
      `cards-ui` below.

      The drawing card (ImageCard, EaselStore, ImageViewer, ImageActions) is IN.
      It is on the tip, was device-tested, and reaches ComfyUI through the
      gateway origin like everything else, so if the backend decision goes the
      other way the card renders nothing -- which is the tolerant-descriptor
      behaviour and is correct. Excluding it now would be a client answer to a
      backend question.

  - name: cards-ui
    source: Valinor/Views/Dynamic/
    destination: Core/Sources/HearthUI/Cards/
    area: 3
    target: ui
    kind: directory
    disposition: edits
    files:
      - from: DynamicComponent.swift
        to: DynamicComponent.swift
        lines: 334
        disposition: edits
        note: >-
          the registry; drop the commissioned dispatches -- BOTH of them.
          ChoamPortfolioDashboardCard at :39-40 and TickerInsightCard at :41-42.
          A server still sending either now falls through to EmptyView, which is
          the tolerant-descriptor behaviour rather than a gap.
      - {from: GeneratedViewCard.swift, to: GeneratedViewCard.swift, lines: 111, disposition: edits}
      - from: RemoteImage.swift
        to: RemoteImage.swift
        lines: 107
        disposition: edits
        note: "shared by the slideshow and the drawing card; stays either way"
      - {from: ImageCard.swift, to: ImageCard.swift, lines: 186, disposition: edits}
      - {from: ImageViewer.swift, to: ImageViewer.swift, lines: 159, disposition: edits}
      - {from: ImageActions.swift, to: ImageActions.swift, lines: 124, disposition: edits}
      - {from: CommissionedCards.swift, to: null, lines: 235, disposition: excluded}
    note: >-
      The renderers. EaselStore sits in `cards` above rather than here: it is a
      store, not a view, and ImageCard reads it across the boundary -- which is

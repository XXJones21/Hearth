    source: ValinorWidgets/Info.plist
    destination: widgets/Info.plist
    area: 5
    target: widgets
    lines: 11
    disposition: edits
    note: >-
      Consumed through INFOPLIST_FILE and must not ALSO be copied as a resource.
      In Valinor this is what the membershipExceptions entry is for; a target
      that omits the exception ships a duplicate and Xcode warns about it in a
      way that is easy to scroll past.

  - name: widgets-entitlements
    source: ValinorWidgetsExtension.entitlements
    destination: widgets/HearthWidgets.entitlements
    area: 5
    target: widgets
    lines: 10
    disposition: edits
    note: "the second of three copies of the app group; reads $(HEARTH_APP_GROUP)"

# ---------------------------------------------------------------------------
# Area 6 -- Visualization and visionOS
#
# Last, because it is the only area needing a second device to verify. What
# crosses is what has been validated on device; the immersive caustics mode has
# not been, and is the whole of the excluded set here.
# ---------------------------------------------------------------------------
  - name: visionos-app-entry
    destination: visionOS/HearthVisionApp.swift
    area: 6
    target: visionos
    disposition: generated
    from: Valinor/ValinorApp.swift
    note: >-
      The visionOS scenes currently behind `#if os(visionOS)` in ValinorApp,
      lifted into their own target's entry point. This is where the topology
      change pays: the guards go away because the target boundary does the same
      job, and RealityKitSceneManager stays hoisted here so the same orb entity
      can reparent between scenes.

  - name: reality-kit-scene
    source: Valinor/Visualization/RealityKitSceneManager.swift
    destination: visionOS/RealityKitSceneManager.swift
    area: 6
    target: visionos
    lines: 611
    disposition: edits
    note: >-
      The renderer. Loses the immersive mode switch and the bloom changes that
      belong to the caustics work; keeps the volumetric path, which is
      device-validated.

  - name: visionos-views
    source: Valinor/VisionOS/
    destination: visionOS/Views/
    area: 6
    target: visionos
    kind: directory
    disposition: edits
    files:
      - from: SulivanVolumeView.swift
        to: PersonaVolumeView.swift
        lines: 231
        disposition: edits
        note: "hosts the volumetric window; scene ids sulivan-volume -> hearth.persona-volume"
      - from: CardOrbitLayout.swift
        to: CardOrbitLayout.swift
        lines: 46
        disposition: edits
        note: "places cards around the orb; device-validated 2026-06-12"
      - {from: LiveTranscriptCardView.swift, to: LiveTranscriptCardView.swift, lines: 61, disposition: edits}
      - {from: SessionGalleryView.swift, to: SessionGalleryView.swift, lines: 108, disposition: edits}
      - {from: CausticsImmersiveView.swift, to: null, lines: 423, disposition: excluded}

  - name: visionos-plist
    source: Info-visionOS.plist
    destination: visionOS/Info.plist
    area: 6
    target: visionos
    lines: 62
    disposition: edits
    note: >-
      An ordinary per-target Info.plist now, not a per-SDK override. That is the
      point of the second target: INFOPLIST_FILE being per-SDK is how
      NSWorldSensingUsageDescription came to be missing from one build and
      present in the other, and ARKit hard-crashes on the authorization request
      when it is absent. Diff this against iOS/Info.plist deliberately.

  - name: visionos-entitlements
    destination: visionOS/HearthVision.entitlements
    area: 6
    target: visionos
    disposition: generated
    note: "the third copy of the app group; reads $(HEARTH_APP_GROUP)"

# ---------------------------------------------------------------------------
# Not an area: the project layer
#
# Hand-made, and the reason `generated` exists as a disposition. A re-scrub must
# never write over these, which is what makes re-scrubbing safe for every Swift
# file above.
# ---------------------------------------------------------------------------
  - name: xcconfig
    destination: Config/
    area: 0
    disposition: generated
    files:
      - {to: Shared.xcconfig,  note: "everything derived from HEARTH_ID_PREFIX and HEARTH_APP_GROUP"}
      - {to: Dev.xcconfig,     note: "one variable"}
      - {to: Release.xcconfig, note: "one variable"}
      - {to: Local.xcconfig,   note: "DEVELOPMENT_TEAM only. GITIGNORED. AS9PH6XDN4 lives here and nowhere else."}

  - name: shared-scheme
    destination: Hearth.xcodeproj/xcshareddata/xcschemes/
    area: 0
    disposition: generated
    note: >-
      Valinor's schemes are marked shared in the per-user management file and
      exist on disk since 2026-06-08, but were never added to the repository, so
      a fresh clone gets whatever Xcode autocreates. Three schemes here, and
      they are committed.

# ---------------------------------------------------------------------------
# Excluded, with the reason and the return route.
#
# Every one of these needs a written disposition BEFORE phase 3, because
# "decide later" during an area landing turns into "copied because it was
# adjacent". Nothing returns by bulk re-import; each returns on a feature branch
# against the clean project, with a stated verification gate.
# ---------------------------------------------------------------------------
excluded:
  - name: on-device-inference
    source: Valinor/OnDevice/
    lines: 734
    files: [InferenceRouter.swift, LocalModelManager.swift, OnDeviceInferenceEngine.swift, PersonaStore.swift]
    why: >-
      Dormant and unlinked. mlx-swift-lm appears in the project's
      packageReferences and in NO target's packageProductDependencies, so
      nothing links it; OnDeviceInferenceEngine guards its entire body on
      `#if canImport(MLX)`, which is false, and compiles to a stub that reports
      itself unavailable. Dropping the package reference removes fourteen
      transitive pins and costs nothing that runs today. Conceptually redundant
      too: the product's thesis is that inference runs on the user's own
      machine, which for an Apple client means the house, not the phone.
    hazard: >-
      LocalModelManager:150 builds http://<ip>:8766/ for GGUF downloads. Port
      8766 is the asset surface, internal only, and has answered nothing in the
      live path since June. PersonaStore had the identical bug and was fixed.
      It is dead code that greps as live configuration. If it ever crosses, it
      crosses with the port already gone.
    returns_when: >-
      there is a reason for a phone to infer locally that "the house is
      unreachable" does not already answer better

  - name: mwdat
    source: Valinor/Compat/WearablesShim.swift
    lines: 118
    also: [3 SPM products, 6 Info.plist keys, the Apps page row, the shared URL scheme]
    why: >-
      The camera is wired and decodes frames at 1fps but processFrame stops
      short of forwarding them; what works is registration and HFP audio, which
      is a Bluetooth headset story the OS already tells. ClientToken and
      MetaAppID are empty strings in the repository, so the integration is not
      configured today -- configuration that exists only on the machine it was
      configured on. And it is expensive at the permission layer: two background
      modes and a Bluetooth prompt a tester meets before receiving any value.
      The shim is deleted rather than ported, because two app targets make it
      unnecessary by construction.
    touches: [AudioInputManager.swift, ValinorApp.swift, ViewModels/ChatViewModel.swift]
    returns_when: >-
      the camera path forwards frames, and a Meta app registration is something
      the product can reasonably ask a user for. It returns as an iOS-app-only
      target dependency behind a protocol declared in HearthCore, never as a
      dependency of the shared layer.

  - name: immersive-caustics
    source: [Valinor/VisionOS/CausticsImmersiveView.swift, Valinor/Visualization/CausticsTexture.swift, Valinor/Visualization/Caustics.metal]
    lines: 677
    why: >-
      Unverified code, and the migration's value is a clean starting point.
      Pushed from a Windows session with no Vision Pro attached; five later
      commits read as a Mac session iterating on device, so it was worked on
      with hardware, but nothing in the repository states it passed. Treat it as
      built and iterated but not signed off.
    note: >-
      The toolchain no longer blocks it -- Xcode 27 and the visionOS 27 SDK are
      installed, and XROS_DEPLOYMENT_TARGET is 27.0 for exactly this reason. The
      rig is written behind `if #available(visionOS 27.0, *)` at two sites,
      which are the only availability checks in the entire client.
    returns_when: >-
      a session builds and runs it on the device. First check on the way back:
      Caustics appears in the built product's default.metallib. A missing Metal
      function fails at runtime with a shader that does not load, not at build
      time.

  - name: mentat-surface
    source: Valinor/Models/MentatState.swift
    lines: 99
    why: >-
      Polls GET /mentat/state every five seconds from HouseStatusBar, which is
      on the main screen. Mentat's run registry is `no` in the backend catalog:
      22 absolute paths, every run personal project work. The poller is quiet on
      failure, so in Hearth it would poll a 404 forever and show nothing.
      Harmless and pointless.
    returns_when: "the component catalog moves the Mentat surface into Hearth, which it will not"

  - name: commissioned-cards
    source: Valinor/Views/Dynamic/CommissionedCards.swift
    lines: 235
    why: >-
      choam_portfolio_dashboard and ticker_insight_card, two of nine card types,
      commissioned for the trading dashboard and already ruled out of Hearth by
      the component catalog. Absent from the desktop extraction too.
    sites: >-
      FOUR, not three as the inventory records: the renderers here, the type
      constants at UiComponentDescriptor.swift:41-42, the registry dispatch at
      DynamicComponent.swift:39-40, and CardLibraryView.swift:242. A fifth is a
      layout comment at ValinorMainView.swift:158, which keeps its reasoning and
      loses the name.
    returns_when: "same as the Mentat surface"

  - name: classic-chat
    source: [Valinor/Views/ChatView.swift, Valinor/Views/MessageBubble.swift, Valinor/ContentView.swift]
    lines: 555
    why: >-
      ChatView is the superseded transcript, reachable only through ContentView
      behind @AppStorage("useClassicChatUI") with nothing in the UI to flip it --
      the switch went with the old Settings page, deleted on purpose in 917ff9d.
      MessageBubble is referenced from exactly one place, ChatView:174, so it is
      not shared and goes with it; the inventory records it as "used by both",
      which is wrong. ContentView is 28 lines that choose between the classic
      view and the main view, so with ChatView gone it collapses to nothing and
      HearthApp hosts HearthMainView directly.
    returns_when: "never; it is superseded, not deferred"

  - name: dead-visualization
    source: [Valinor/Views/VisualizationChatView.swift, Valinor/Visualization/VisualizationView.swift, Valinor/Visualization/DeviceMotionTracker.swift]
    lines: 402
    why: >-
      VisualizationChatView is referenced nowhere in the tree. VisualizationView
      is used only by it, and DeviceMotionTracker only by VisualizationView. A
      three-file chain hanging off nothing.
    returns_when: "never"

  - name: tts-blob-player
    source: Valinor/TTSAudioPlayer.swift
    lines: 139
    why: >-
      Plays whole audio blobs through AVAudioPlayer and is still called from
      handleAudioResponse, so it is a live fallback for a non-streaming server
      rather than dead code -- which is why excluding it is an edit to
      ChatViewModel and not just a deletion. Hearth serves one TTS engine and
      one format.
    returns_when: "a Hearth backend serves non-streaming audio, which the native runtime does not"

  - name: audio-capture-path
    source: Valinor/AudioInputManager.swift
    symbols: [startStreaming, processAudioBuffer]
    why: >-
      A 48kHz-to-16kHz capture and upload path that nothing calls.
      startStreaming() has no caller anywhere. Server-side Whisper is not the
      phone's path: STT is on-device and that is a product claim.
    returns_when: "never; the file's session config crosses without it"

  - name: mlx-package
    source: Package.resolved
    why: >-
      mlx-swift-lm tracked on `main` with no version pin, pulling fourteen
      transitive pins (mlx-swift, swift-transformers, swift-huggingface,
      swift-jinja, yyjson, NIO, swift-crypto and the rest) for a path that links
      into nothing. The clean project keeps ZERO third-party packages:
      URLSessionWebSocketTask, AVAudioEngine, SFSpeechRecognizer, Canvas,
      WidgetKit and RealityKit are all first party.
    policy: >-
      Dependencies attach to targets, never to the project. A project-level
      reference costs every build and can link nothing at all, silently, for as
      long as nobody looks. That is what happened here.


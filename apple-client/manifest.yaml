  - name: persona-model-view
    source: Valinor/Visualization/PersonaModelView.swift
    destination: Core/Sources/HearthUI/Persona/PersonaModelView.swift
    area: 3
    target: ui
    lines: 335
    disposition: edits
    note: >-
      The glb_animated renderer, called from the iOS main view and reachable

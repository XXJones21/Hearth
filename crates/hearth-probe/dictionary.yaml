# The model dictionary.
#
# Every byte size and every filename below was read from the Hugging Face API on
# 2026-08-04, not from documentation prose. Tier 2's file is byte-for-byte the
# one currently resident on VYTAL, which is the best confirmation available that
# the naming is right.
#
# Sizes are the server's own content-length, not the figure printed on a model
# card. Cards report decimal GB and everything here is bytes, so taking a card
# at face value overstates every model by about 7 percent. `hearth-probe verify`
# re-checks these against the server and flags drift.
#
# kv_bytes_per_token is an ESTIMATE used to size the context window against the
# remaining memory budget. It is the least trustworthy number here. Derived as
# 2 (K and V) * layers * kv_heads * head_dim elements at roughly 0.56 bytes per
# element with a q4_0 cache, NOT measured. Erring high costs context; erring low
# costs a failed model load, so err high.
#
# OPEN, and measurable: with these numbers a 16 GB card plans 65536 tokens for
# tier 2, while valinor-rust.service pins 16384 with a comment calling that "the
# proven 16 GB-fit value". One of the two is wrong and a single load settles it.

# The runtime the installer places under <root>/runtime. Same rules as the
# tiers: sizes are server content-length, hashes are the publisher's own.
# The llama.cpp zips have no published sha256 (GitHub releases carry none);
# size-only until our packaging pass computes and pins them.
runtime:
  python:
    windows:
      url: https://github.com/astral-sh/python-build-standalone/releases/download/20260805/cpython-3.13.14%2B20260805-x86_64-pc-windows-msvc-install_only.tar.gz
      bytes: 47056137
      sha256: ab746e98c31913a83da4af5b60ea0b024ea20f3c3327e4e21ef3106013c549a3
    macos:
      url: https://github.com/astral-sh/python-build-standalone/releases/download/20260805/cpython-3.13.14%2B20260805-aarch64-apple-darwin-install_only.tar.gz
      bytes: 25285557
      sha256: b0ead4fbac288282c0806412103038789e0b2c79e45ff95758bb11761f6d3b0e
  llama_server:
    release: b10298
    # The macOS asset is a tar.gz with a versioned top directory; the
    # provisioner strips it so the binary lands at runtime/llama-server/.
    macos_metal:
      - url: https://github.com/ggml-org/llama.cpp/releases/download/b10298/llama-b10298-bin-macos-arm64.tar.gz
        bytes: 10981117
    windows_cuda:
      - url: https://github.com/ggml-org/llama.cpp/releases/download/b10298/llama-b10298-bin-win-cuda-12.4-x64.zip
        bytes: 250457449
      - url: https://github.com/ggml-org/llama.cpp/releases/download/b10298/cudart-llama-bin-win-cuda-12.4-x64.zip
        bytes: 391443627
    windows_vulkan:
      - url: https://github.com/ggml-org/llama.cpp/releases/download/b10298/llama-b10298-bin-win-vulkan-x64.zip
        bytes: 34108466
  # The voice engine's environment: what pip installs into <root>/envs/voice.
  # torch comes from the accelerator-matched index; everything else from PyPI.
  # The engine weights themselves are the `voice:` entry below, prefetched
  # into the HF cache under the install root.
  voice_env:
    package: omnivoice==0.1.5
    extras:
      - soundfile
      # omnivoice brings plain uvicorn; without a WebSocket library the /tts
      # upgrade 404s and the product is silent. Found on the first fresh
      # install; the testbed env happened to carry it.
      - websockets
    torch_index_cuda: https://download.pytorch.org/whl/cu130

reserves:
  # Held out of the budget before a model is chosen. Re-derived 2026-08-07 by
  # measuring an 8 GB M2 Air rather than estimating, after the old figures
  # declared coexistence impossible on a machine that turned out to manage it.
  #
  # The torch voice, which is still the engine everywhere omnivoice.cpp has not
  # been validated. Platforms that HAVE switched carry their own figure under
  # `voice:` below, because the reserve belongs to the engine rather than to
  # the product, and shrinking it everywhere at once would silently re-tier
  # machines nobody has run.
  voice_resident_bytes: 2362232012 # torch OmniVoice on the GPU, ~2.2 GiB
  # Whisper base, measured on the Air: 213 MiB for the torch import, 459 MiB
  # for the model, 45 MiB more through one inference. The 139 MB download is
  # the weights alone and is NOT the resident cost -- reading it as such would
  # have cut this reserve to a quarter of what the process actually holds.
  stt_bytes: 805306368 # Whisper base, 768 MiB (717 MiB measured, rounded up)
  # macOS on 8 GB measured ~2.0 GiB wired with nothing of ours running. Kept a
  # little above that: this is the reserve that protects the machine, and the
  # cost of erring low is a wedged laptop rather than a smaller context.
  os_unified_bytes: 2415919104 # host OS on shared memory, ~2.25 GiB
  headroom_bytes: 1073741824 # ~1.0 GiB, so a full card is not a wedged card

voice:
  name: OmniVoice
  # Two engines during the crossover, and the planner picks by platform.
  #
  # macOS runs omnivoice.cpp because the torch build has no MPS path at all:
  # it selects cuda-or-cpu, lands on the processor, and synthesises at about
  # 7.6x realtime, which is not a voice. Windows measured the C++ engine on
  # CUDA 2026-08-08 (RTF 0.05 vs torch 0.07, first audio 0.53s vs 0.67s,
  # ~20s cold start vs a minutes-long torch prime, tags and arpabet
  # confirmed performing by ear) and moved. Linux keeps torch until someone
  # runs the same measurement there.
  cpp_platforms: [macos, windows]

  # Where the torch engine's weights come from. Whole-repository snapshot into
  # the Hugging Face cache; no file list, because it fetches all of it.
  torch_repo: k2-fsa/OmniVoice
  torch_download_bytes: 3328599654 # ~3.1 GiB of Hugging Face cache

  repo: Serveurperso/OmniVoice-GGUF
  # The engine binary ships in the bundle; only weights are fetched. Two files
  # that load together, the Qwen3 backbone and the HuBERT/DAC/RVQ tokenizer.
  download_bytes: 945284608 # 656 MB base + 289 MB tokenizer
  resident_bytes: 966367641 # omnivoice.cpp Q8_0, measured with the brain alongside
  files:
    - file: omnivoice-base-Q8_0.gguf
      bytes: 656395008
      sha256: null # LFS oid not recorded yet; see FOLLOW-UP below
    - file: omnivoice-tokenizer-Q8_0.gguf
      bytes: 288889600
      sha256: null
  # MaskGIT decode steps. The quality/speed lever, near linear: on an M2 Air
  # with the cloned voice, 32 steps runs 4.37x realtime, 16 runs 2.18x, 8 runs
  # 1.16x and 4 runs 0.63x. A voice that cannot keep up with speech is not a
  # voice, so the default buys realtime and the quality that is left.
  #
  # FOLLOW-UP: sha256 for both files, so the installer can verify them the way
  # it verifies weights. And the step default wants a listening test on real
  # hardware rather than a number chosen from a table.
  steps: 8

tiers:
  - id: 0
    label: Minimum
    model: Gemma 4 E2B
    repo: unsloth/gemma-4-E2B-it-GGUF
    file: gemma-4-E2B-it-Q4_K_M.gguf
    quant: Q4_K_M
    bytes: 3106738272 # 2.89 GiB, server content-length
    sha256: 740185b21d22ceb83a11c3aa62ad5842ef32c70f6096d756bbee85a1e4ec34b8
    max_ctx: 32768
    kv_bytes_per_token: 12288
    note: >-
      Built to run on the device rather than in a datacentre. The largest model
      that still leaves room for a voice on a small machine.
    fallback:
      file: gemma-4-E2B-it-Q3_K_M.gguf
      quant: Q3_K_M
      bytes: 2536786016 # 2.36 GiB, server content-length
      sha256: 086e2f5ba85057f8f19712e3160a644728f74f323c9feeac4cd73fab11b43085
    # The ladder, best quality first. On an 8 GB Mac the budget is 3.0 GiB and
    # this model spends 12288 bytes per token of context, so every 12 MB of
    # weights costs about 1000 tokens. Q4_K_M reaches only 9216 tokens, which
    # is under a third of what the model can hold and not much more than a
    # persona prompt plus its tools; IQ4_XS gives up ~0.5 bits per weight and
    # buys back twice the window. Sizes and hashes are the Hugging Face LFS
    # records, read from the repo rather than a model card.
    #
    # FOLLOW-UP: tiers 1-3 still carry the old single-fallback shape. They want
    # the same ladder, but their numbers have to be read off the host first;
    # a build listed without a verified hash is one the installer cannot check.
    builds:
      - file: gemma-4-E2B-it-Q4_K_M.gguf
        quant: Q4_K_M
        bytes: 3106738272 # 2.89 GiB
        sha256: 740185b21d22ceb83a11c3aa62ad5842ef32c70f6096d756bbee85a1e4ec34b8
      - file: gemma-4-E2B-it-IQ4_XS.gguf
        quant: IQ4_XS
        bytes: 2983944288 # 2.78 GiB
        sha256: c149620926221669c4941ae6dac259953cc729c48e4a4edb69e9807b782fd1e3
      - file: gemma-4-E2B-it-UD-Q3_K_XL.gguf
        quant: UD-Q3_K_XL
        bytes: 2923782240 # 2.72 GiB
        sha256: 5b31419a03610fb8d8e80b3cd1e27e2898c601c71ca7d2637076b870d0e6dfd1
      - file: gemma-4-E2B-it-Q3_K_M.gguf
        quant: Q3_K_M
        bytes: 2536786016 # 2.36 GiB
        sha256: 086e2f5ba85057f8f19712e3160a644728f74f323c9feeac4cd73fab11b43085

  - id: 1
    label: Small
    model: Gemma 4 E4B
    repo: unsloth/gemma-4-E4B-it-GGUF
    file: gemma-4-E4B-it-Q4_K_M.gguf
    quant: Q4_K_M
    bytes: 4977171584 # 4.64 GiB, server content-length
    sha256: 85a896a047553e842f25297ee5b031d64ff30147d9c4af17b1e4b394cd1fab87
    max_ctx: 32768
    kv_bytes_per_token: 20480
    note: >-
      The same on-device architecture with roughly twice the active parameters.
      Noticeably better at holding a thread.
    fallback:
      file: gemma-4-E4B-it-Q3_K_M.gguf
      quant: Q3_K_M
      bytes: 4058137728 # 3.78 GiB, server content-length
      sha256: 0980898d0e7d9c75cea05141bf4010393312101ef6cf5b31f8197e0de18655f4

  - id: 2
    label: Recommended
    model: Gemma 4 12B
    repo: unsloth/gemma-4-12B-it-qat-GGUF
    file: gemma-4-12B-it-qat-UD-Q4_K_XL.gguf
    quant: UD-Q4_K_XL
    bytes: 6716356800 # 6.26 GiB, server content-length (on-disk copy is 1472 bytes smaller)
    sha256: 90fd44e29e0d7cffeb0fd00dc73cfdab9ed0b0e95306ecf7821ea634c940c370
    max_ctx: 65536
    kv_bytes_per_token: 57344
    note: >-
      The quantization-aware build, which keeps its quality at four bits better
      than a plain one. Comfortable on 16 GB with the voice alongside.
    fallback: null

  - id: 3
    label: Large
    model: Gemma 4 26B A4B
    # The QAT build (2026-08-08): quality held at four bits the way the 12B
    # tier's QAT does, and the only quant the repo ships. On cards below the
    # model's fully-resident floor the installer writes HEARTH_LLAMA_CPU_MOE
    # (config_gen.rs): experts stream from system RAM by design, where the
    # non-QAT Q3 spilled by accident and ground at 0.3 tok/s on a 16 GB card.
    repo: unsloth/gemma-4-26B-A4B-it-qat-GGUF
    file: gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
    quant: UD-Q4_K_XL
    bytes: 14249047104 # 13.27 GiB, HF lfs size
    sha256: a7c5bc715f5ff8e99a3e8901ce7d2b42b402c669bf24f7c5250747633d0f5891
    max_ctx: 65536
    kv_bytes_per_token: 49152
    note: >-
      A mixture-of-experts model: far more total knowledge, with only a slice of
      it active per token. On a 16 GB card its experts run from system RAM.
    fallback: null

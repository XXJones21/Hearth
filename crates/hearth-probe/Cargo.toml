[package]
name = "hearth-probe"
version = "0.1.0"
edition = "2021"
description = "Looks at a machine and decides what Hearth it can run."

[lib]
name = "hearth_probe"
path = "src/lib.rs"

[[bin]]
name = "hearth-probe"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.11", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
sysinfo = "0.30"
